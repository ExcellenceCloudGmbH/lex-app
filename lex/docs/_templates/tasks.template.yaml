version: 1
tasks:
  - id: TASK-001
    title: Create ingestion validation layer
    description: >-
      Implement schema validation for input files before model mapping.
      Validation errors must be deterministic and user-readable.
    acceptance_criteria:
      - Invalid rows are rejected with actionable error messages.
      - Valid rows proceed to mapping without modification.
      - Validation output is covered by unit tests.
    labels:
      - backend
      - validation
    related_docs:
      - docs/25-TASK-FORMAT.md
      - docs/24-IMPLEMENTATION-CHECKLIST.md
    jira_issue_type: Task
    slug: ingestion-validation

  - id: TASK-002
    title: Generate audit-ready processing report
    description: >-
      Add report generation output that summarizes processed rows, rejected rows,
      and key business counters for audit review.
    acceptance_criteria:
      - Report file is generated for every successful run.
      - Report includes totals and rejection reasons.
      - Output path is documented in run artifacts.
    labels:
      - reporting
    related_docs:
      - docs/20-TASKING-AND-AUDIT.md
