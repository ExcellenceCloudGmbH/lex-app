        def track(self):
            if hasattr(self, 'skip_history_when_saving'):
                del self.skip_history_when_saving


        def untrack(self):
            self.skip_history_when_saving = True

        def save_without_historical_record(self, *args, **kwargs):
            self.skip_history_when_saving = True
            try:
                ret = self.save(*args, **kwargs)
            finally:
                del self.skip_history_when_saving
            return ret

