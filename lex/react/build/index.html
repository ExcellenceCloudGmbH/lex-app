  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      (function(w,d){if(w.Quackback)return;w.Quackback=function(){
      (w.Quackback.q=w.Quackback.q||[]).push(arguments)};
      var s=d.createElement("script");s.async=true;
      var applicationKey = window.location.hostname === 'localhost' ? "lex-app-local" : "lex-app-production";
      var environment = window.location.hostname === 'localhost' ? "local" : "production";
      s.crossOrigin="anonymous";
      s.dataset.applicationKey=applicationKey;
      s.dataset.environment=environment;
      s.src="https://hub.excellence-cloud.de/api/widget/sdk.js";
      d.head.appendChild(s)})(window,document);

      function getCookie(name) {
        var value = "; " + document.cookie;
        var parts = value.split("; " + name + "=");
        if (parts.length === 2) return parts.pop().split(";").shift();
        return "";
      }

      Quackback("init", {
        instanceUrl: "https://hub.excellence-cloud.de",
        applicationKey: "lex-app-local",
        environment: "local"
      });

      fetch("/api/quackback-widget-token", {
        method: "POST",
        credentials: "include",
        headers: {
          "X-CSRFToken": getCookie("csrftoken")
        }
      })
        .then(function(res) {
          if (!res.ok) throw new Error("Failed to fetch widget token");
          return res.json();
        })
        .then(function(data) {
          if (!data || !data.ssoToken) throw new Error("Missing widget token");
          Quackback("identify", { ssoToken: data.ssoToken });
        })
        .catch(function(err) {
          console.warn("Quackback identify failed", err);
        });
    </script>
