      must skip them via get_root_model()/get_current_model()
  r:
    title: A run started by a create has its own audit entry
    scenarios: 6.119-6.120
    status: complete
    tests:
      pass: 2
      skip: 0
      xfail: 0
    note: >-
      6.119 create and run are two entries - the create's finalised to 'success', the run's an 'update'
      under its own <model>_<pk>_update_<uuid> calculation id, also 'success'; 6.120 a failed run's
      entry is 'failure' with a traceback while the create's entry stays 'success'.
  s:
    title: Export & download audit mechanism
    scenarios: 6.121-6.124
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      The export/download half of the trail's contract, pinned through the file-download endpoint:
      `export` and `download` are recordable actions that round-trip through the table and `to_dict`
      (6.121); an API-key caller is named `Technical User`, not `AnonymousUser` (6.122); the entry
      exists and reads `pending` from inside the view, before the file is served, and is finalised
      afterwards (6.123); a failure the API layer has no answer for still leaves a `failure` entry
      carrying its traceback (6.124). Per-endpoint coverage lives in 10p, 13i and 15l.
  t:
    title: Who reads export & download entries
    scenarios: 6.160-6.167
    status: complete
    tests:
      pass: 8
      skip: 0
      xfail: 0
    note: >-
      The read side of 6s, behind LEX_SEC_READ_SURFACES. A download entry is visible to whoever may
      read its record and hidden from others (6.160); a model-wide export entry to whoever may export
      the model (6.161); a record's history is one filtered query (6.162); the payload comes back whole
      (6.163); auditlogstatus rows follow their entry (6.164); tracebacks are superuser-only (6.165);
      the opt-out restores the payload check (6.166); the detail endpoint applies the list's rule
      (6.167). 6.160-6.165 and 6.167 fail on the #840 head.
  u:
    title: Fleet-metrics audit contract — the backfill's columns
    scenarios: '6.168'
    status: complete
    tests:
      pass: 3
      skip: 0
      xfail: 0
    note: >-
      Pins AuditLog.id/date/author/resource/payload/calculation_id and
      AuditLogStatus.audit_log_id/status/created_at/updated_at (name, type,
      db_table, auto_now_add/auto_now) at the Model._meta level — the exact
      columns the out-of-repo fleet-metrics backfill reads by name and type
      (task 12). Model-metadata only, no DB access needed.
