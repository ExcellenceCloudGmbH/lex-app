    title: Calculation-log cache backfill buffer cap
    scenarios: ''
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: scenarios 6.109–6.113; bounds `CacheManager.store_message` to a 256 KB tail (+ applies `CACHE_TIMEOUT`)
