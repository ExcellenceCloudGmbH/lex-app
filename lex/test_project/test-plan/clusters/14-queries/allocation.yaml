  k:
    title: Value-list filters — Set keys converted, blanks, empty selections, Multi
    scenarios: 14.45-14.50
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      The grid's value-list filter sends string keys, null for blank and a Multi model for a
      condition plus a list. _build_filter_q converted nothing (a "false" key 500ed on a boolean),
      matched no blank (SQL IN skips NULL), treated an empty selection as "no filter", and dropped
      Multi entirely, widening the result. 14.45-14.48 pin each answer, 14.49 that a bad key is a
      400 naming the field, 14.50 that an unknown filterType still means "no filter" and is logged.
  g:
    title: filter_values — a column's values with counts under the other filters
    scenarios: 14.51-14.79
    status: complete
    tests:
      pass: 29
      skip: 0
      xfail: 0
    note: >-
      New endpoint for the grid's value-list filters and filter bar. Subclasses ListModelEntries, so
      as_of, the read filter and the 14k translation are the list's own. 14.51 pins that a column's
      own filter is left out and the others narrow; 14.52 keys and labels per type; 14.53 a ticked
      value at 0; 14.54 search (database for text, labels for foreign keys); 14.55 limit and
      truncated, with ticked values kept past the cut; 14.56 order; 14.57 refusals; 14.58 as_of;
      14.59 bad keys in other filters; 14.60 the database and per-row counts agree. Field-level
      permissions are cluster 4q.
      Fix round 1 (14.61-14.72), after a review found the first pass could show a value the grid
      withholds: a shared value_list_field resolver in filterable_fields.py now allowlists column
      types per the design's §1 table and refuses a credential-shaped name whatever the serializer
      (14.61, 14.66) and a serializer field whose source is not itself -- a SerializerMethodField or
      a renamed field (14.63); LexSerializer.readable_field_names, extracted from to_representation,
      is reused by the per-row path so an overridden can_read is honoured even when permission_read
      is left open (14.65), with a cached base UserContext so a 50k-row scan costs one groups query,
      not one per row; uses_default_read_permission now also covers a model with neither method at
      all and the literal LexModel-default identity, each exercised by its own fixture since a
      LexModel that simply never overrides permission_read is NOT the same as a model with no such
      method (the former still hits the Keycloak-UMA row filter) (14.64, 14.69); a foreign key's
      label is resolved only for ticked keys a readable row confirms, via one probe through the same
      counting path, never for a key only a hidden row carries (14.62); "" and NULL fold into one
      blank bucket on a plain text column, in both filter_values and List.py's set branch (14.70);
      ordering is numeric for a plain integer column (14.71); selected keys are normalised like
      stored keys and capped at 1,000, and a search-missed ticked value is not added back (14.72);
      14.67 pins the POST-only route; 14.68 the two scan limits and limit clamping. GET and HEAD
      were already 405 before this round -- 14.67 only confirms it stays that way.
      Fix round 2 (14.73-14.75), after a re-review: uses_default_read_permission's capability
      target now walks the WHOLE instance_type chain (reusing
      base_serializers._resolve_history_source_model) instead of one level, so a meta-history
      container -- whose instance_type is the historical class, not the root tracked model -- no
      longer wrongly takes the database path and leaks a hidden row's values (14.73, also covering
      historical ?as_of=, whose queryset resolves through the meta-history table); 14.65 now also
      calls uses_default_read_permission directly against a throwaway model that overrides ONLY
      can_read, proving the check needs BOTH identities, not just permission_read's (verified by a
      documented mutation: deleting the can_read identity check makes 14.65 fail); 14.74 pins the
      round-1 groups-query bound explicitly (CaptureQueriesContext, 5 rows vs 20, verified by a
      mutation that disables the fast path and makes the query count scale); 14.69 now exercises a
      real LexModel keeping BOTH methods at their literal default through the real endpoint (a
      Keycloak-UMA grant installed by replacing KeycloakPermissionsMiddleware.__call__ for the
      test, never a real Keycloak call), with values/counts/labels derived from the list endpoint's
      own response rather than hard-coded, and 14.64 does the same; an unconvertible ticked foreign
      key is converted with the target field's to_python before the visibility probe and left out
      of it rather than raised as a 400 (14.62); the per-row scan and its FK-visibility probe now
      share one aggregated warning per request; 14.63's renamed-field case now names a real column
      (amount) re-sourced from another real column (name), since the former case was refused for
      being a nonexistent field regardless of the source check (verified by a mutation); 14.71
      gained an equal-label tie ordered by key; 14.72 also asserts no "True" key leaks in. A
      separate addendum closed a parity gap the fast path introduced: it resolved permission_read
      through with_instance, which recomputes keycloak_scopes from user_permissions and so drops an
      API-key caller's own scopes (identity.scopes, carried on the early-return API-key context)
      that can_read(request)'s own from_request call would not have dropped; readable_field_names
      now skips the fast path for an API-key request (UserContext._api_key_context(request) is not
      None, checked once per scan) and calls can_read directly instead, matching the grid (14.75).
      Final review (14.76-14.79, 14.66 widened): is_value_list_field accepts CharField but no longer
      TextField -- long text keeps its text condition only (14.66 now also refuses QueryItem.summary);
      is_plain_text_field still covers both for database search and blank folding. A model opts out
      with lex_value_lists = False, checked on the model and on the tracked model a history
      container records (model_offers_value_lists); AuditLog opts out because its read permission is
      decided per entry, and 14.79 refuses its id, author, resource and action. Foreign-key labels
      are looked up and keyed by the FK's target field, so a to_field FK (QueryLedgerEntry.ledger ->
      QueryLedger.number) is labelled from the ledger whose number it stores, not from a decoy whose
      primary key equals it, and a __str__ that raises leaves the key as its label instead of a 500
      (14.76). 14.77 pins the shipped boolean shape (JSON true / false in a Set) on the list POST and
      14.78 Set and Multi -- with blank and an empty selection -- on the group level; neither needed
      a code change, and each fails under a matching mutation (str() of a JSON boolean; blanks
      dropped and an empty selection ignored). TestCluster14g_SerializerDependentRefusals registers
      its api_serializers restore with addCleanup before the change.
  j:
    title: GET list — the __blank query-param lookup suffix
    scenarios: 14.80-14.83
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      "Select All Records" fetches ids through the list GET endpoint's query-param filters, which
      could only ask field__isnull=true -- so a GET-driven select-all undercounted the "" rows the
      POST Set filter's blank key (14.46/14.70) already folds in on a plain text column. blank is
      not a Django lookup: SAFE_LOOKUPS and _resolve_lookup now accept it as a safe suffix, and
      _build_query_from_values builds the Q itself -- NULL-or-"" on a plain text column
      (is_plain_text_field), NULL only otherwise -- instead of handing Django a field__blank lookup
      it would reject. 14.80 pins ?field__blank=true on both column shapes; 14.81 that
      ?field__blank=false and the equivalent ?field__blank!=true both return the non-blank rows.
      Restricted to a direct column on this model (field_path has no "__" of its own): a related
      path (e.g. category__name__blank) is ignored exactly like a JSON sub-path, both ruled out in
      14.81's fix-round-1 sub-cases after a review found the first pass wrongly applied the related
      path as if it resolved to a column on this model; a direct FK column's own blank state (e.g.
      category__blank) is unaffected and stays supported. Fix round 2 (C1, final review of
      feat/multi-value-filters): the same GET grammar's __exact and __in ran every value through
      _coerce_value regardless of field type, which lowered any "null"/"none" spelling to Python
      None and any "true"/"false" spelling to a bool for EVERY column -- so a value-list Set
      filter's own stored key "none" on a CharField/choice column resolved to IS NULL instead of
      matching the literal row, and the same key inside __in silently dropped out. 14.82 pins that
      __exact and __in now convert each value by the column's own type, reusing the POST Set
      filter's conversion helper (_set_filter_values, now built on shared _typed_value_converter /
      _coerce_typed_value) instead of duplicating it: a foreign key's target field's to_python, a
      boolean's _bool_from_key, the field's own to_python otherwise. A value that fails that
      conversion is dropped, and if NONE of the given values survive the whole lookup matches no
      rows (Q(pk__in=[])) rather than ever becoming a 400 on a GET read -- returning "no filter"
      there would fail open (an unconvertible ?category__in=abc would otherwise match the whole
      table). Bare keys and every other lookup suffix keep the legacy, type-blind _coerce_value
      unchanged, so ?field=null still means IS NULL for existing callers. Fix round 3 (residual,
      same re-review): a JSONField is the one exception to "every other field type stays typed" --
      it keeps the legacy _coerce_value on __exact/__in too, for the whole column and for any
      sub-path, because a JSON value's own spelling already says its type (5 is a number, "5" a
      string, true a bool, null is null); there is no single column type to convert a raw query
      string by. Before this fix a JSON sub-path through __in (e.g. ?metadata__key__in=5) fell back
      to _typed_value_converter's generic model_field.to_python, which for JSONField is the
      inherited identity -- so the raw string "5" matched the row storing the JSON STRING "5"
      instead of the row storing the JSON NUMBER 5. 14.83 pins the sub-path and whole-column shapes
      on both __in and __exact (the __exact sub-path case already fell through to the legacy path
      untouched, since its path-equality guard excludes a JSON sub-path on its own -- a regression
      guard, not a new fix). The check lives in _coerce_typed_value (GET-only), not in the shared
      _typed_value_converter, since model_field is the same JSONField object for the whole column
      and for a sub-path alike.
