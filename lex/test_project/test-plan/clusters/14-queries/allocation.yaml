  f:
    title: Value-list filters — Set keys converted, blanks, empty selections, Multi
    scenarios: 14.36-14.41
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      The grid's value-list filter sends string keys, null for blank and a Multi model for a
      condition plus a list. _build_filter_q converted nothing (a "false" key 500ed on a boolean),
      matched no blank (SQL IN skips NULL), treated an empty selection as "no filter", and dropped
      Multi entirely, widening the result. 14.36-14.39 pin each answer, 14.40 that a bad key is a
      400 naming the field, 14.41 that an unknown filterType still means "no filter" and is logged.
  g:
    title: filter_values — a column's values with counts under the other filters
    scenarios: 14.42-14.66
    status: complete
    tests:
      pass: 25
      skip: 0
      xfail: 0
    note: >-
      New endpoint for the grid's value-list filters and filter bar. Subclasses ListModelEntries, so
      as_of, the read filter and the 14f translation are the list's own. 14.42 pins that a column's
      own filter is left out and the others narrow; 14.43 keys and labels per type; 14.44 a ticked
      value at 0; 14.45 search (database for text, labels for foreign keys); 14.46 limit and
      truncated, with ticked values kept past the cut; 14.47 order; 14.48 refusals; 14.49 as_of;
      14.50 bad keys in other filters; 14.51 the database and per-row counts agree. Field-level
      permissions are cluster 4o.
      Fix round 1 (14.52-14.63), after a review found the first pass could show a value the grid
      withholds: a shared value_list_field resolver in filterable_fields.py now allowlists column
      types per the design's §1 table and refuses a credential-shaped name whatever the serializer
      (14.52, 14.57) and a serializer field whose source is not itself -- a SerializerMethodField or
      a renamed field (14.54); LexSerializer.readable_field_names, extracted from to_representation,
      is reused by the per-row path so an overridden can_read is honoured even when permission_read
      is left open (14.56), with a cached base UserContext so a 50k-row scan costs one groups query,
      not one per row; uses_default_read_permission now also covers a model with neither method at
      all and the literal LexModel-default identity, each exercised by its own fixture since a
      LexModel that simply never overrides permission_read is NOT the same as a model with no such
      method (the former still hits the Keycloak-UMA row filter) (14.55, 14.60); a foreign key's
      label is resolved only for ticked keys a readable row confirms, via one probe through the same
      counting path, never for a key only a hidden row carries (14.53); "" and NULL fold into one
      blank bucket on a plain text column, in both filter_values and List.py's set branch (14.61);
      ordering is numeric for a plain integer column (14.62); selected keys are normalised like
      stored keys and capped at 1,000, and a search-missed ticked value is not added back (14.63);
      14.58 pins the POST-only route; 14.59 the two scan limits and limit clamping. GET and HEAD
      were already 405 before this round -- 14.58 only confirms it stays that way.
      Fix round 2 (14.64-14.66), after a re-review: uses_default_read_permission's capability
      target now walks the WHOLE instance_type chain (reusing
      base_serializers._resolve_history_source_model) instead of one level, so a meta-history
      container -- whose instance_type is the historical class, not the root tracked model -- no
      longer wrongly takes the database path and leaks a hidden row's values (14.64, also covering
      historical ?as_of=, whose queryset resolves through the meta-history table); 14.56 now also
      calls uses_default_read_permission directly against a throwaway model that overrides ONLY
      can_read, proving the check needs BOTH identities, not just permission_read's (verified by a
      documented mutation: deleting the can_read identity check makes 14.56 fail); 14.65 pins the
      round-1 groups-query bound explicitly (CaptureQueriesContext, 5 rows vs 20, verified by a
      mutation that disables the fast path and makes the query count scale); 14.60 now exercises a
      real LexModel keeping BOTH methods at their literal default through the real endpoint (a
      Keycloak-UMA grant installed by replacing KeycloakPermissionsMiddleware.__call__ for the
      test, never a real Keycloak call), with values/counts/labels derived from the list endpoint's
      own response rather than hard-coded, and 14.55 does the same; an unconvertible ticked foreign
      key is converted with the target field's to_python before the visibility probe and left out
      of it rather than raised as a 400 (14.53); the per-row scan and its FK-visibility probe now
      share one aggregated warning per request; 14.54's renamed-field case now names a real column
      (amount) re-sourced from another real column (name), since the former case was refused for
      being a nonexistent field regardless of the source check (verified by a mutation); 14.62
      gained an equal-label tie ordered by key; 14.63 also asserts no "True" key leaks in. A
      separate addendum closed a parity gap the fast path introduced: it resolved permission_read
      through with_instance, which recomputes keycloak_scopes from user_permissions and so drops an
      API-key caller's own scopes (identity.scopes, carried on the early-return API-key context)
      that can_read(request)'s own from_request call would not have dropped; readable_field_names
      now skips the fast path for an API-key request (UserContext._api_key_context(request) is not
      None, checked once per scan) and calls can_read directly instead, matching the grid (14.66).
