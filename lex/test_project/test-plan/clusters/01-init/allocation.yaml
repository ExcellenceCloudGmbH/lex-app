  ad:
    title: Streamlit theme follower
    scenarios: 1.261-1.273
    status: complete
    tests:
      pass: 16
      skip: 0
      xfail: 0
    note: >-
      Python side of lex-app <-> Streamlit theme agreement. Streamlit's theme is boot-time
      config, so a page can only follow a change by reloading - which makes a WRONG reload
      expensive (it discards typed input) and a missed one merely cosmetic. Hence 1.263: a URL
      with no embed_options must report "" and not "light", or every standalone tab would reload
      on a guess. 1.266 pins the storage key to one Python definition, because the relay in
      proxy.py and the follower drift apart silently - both halves keep working alone and sync
      just stops. 1.268 found a real hole while being written: json.dumps escapes what JS needs
      but not "</script>", which the HTML parser acts on first, so the value could close the
      element and inject markup; fixed by escaping angle brackets as \u003c/\u003e.
      GAP: the emitted script's runtime behaviour is verified only by a DOM-double harness run
      by hand (7 cases, all passing) - this repo has no JS runner, so it is not in CI. Moving it
      to the frontend repo's vitest would close that.
      1.269 covers the SECOND delivery path, added after the relay was found not to reach a real
      deployment: widgets embedded IN a Streamlit page postMessage their palette to the host, and
      the shim - served by the Streamlit server, so same-origin with the page - turns that into
      the storage write the follower waits for. This is the path that survives cross-SITE
      deployments, where browsers give the relay iframe partitioned storage and its write lands
      somewhere the page never reads. The test pins the three links that are each silent when
      broken: the component accepts and forwards the key, both host call sites supply it, and the
      static shim reads it from args rather than keeping a second copy.
      1.270 covers a lifetime bug found by re-reading the follower against Streamlit's rerun
      model, not by a failing test: the install flag lived on the persistent Streamlit page while
      the storage listener lived on the component iframe, which Streamlit destroys and recreates
      per rerun. That combination works for exactly one render - the next iframe sees the flag,
      returns early, and the iframe holding the listener is already gone, so nothing listens and
      nothing is logged. Both now live on the page. The same pass moved the initial read to the
      page's storage and added one console.info per decision, because three cross-context hops
      with no UI of their own make "never arrived" and "arrived and was already correct"
      indistinguishable from the outside.
      1.271 shortens the embedded path rather than debugging it further. It was widget -> shim ->
      localStorage -> storage event -> follower -> reload; the shim is already inside the page's
      frame tree and same-origin with it, so the follower now publishes host.__lexThemeFollow and
      the shim calls it outright: widget -> shim -> follower -> reload. Three fewer links, each of
      which was silent when broken and only reachable by guessing. The storage route is retained,
      not replaced - it is the only way in for a writer with no handle to the page (the relay
      iframe, a sibling tab, and a shim that reports before the follower has rendered, which the
      install-time read covers). Harness after the change: 8/8 across both routes.
      1.272 is the bug that made all of this look dead. The background measurement parsed
      "rgba(0, 0, 0, 0)" into four zeroes, passed a "length < 3" guard, and computed luma 0 -
      pure black - so ANY page whose measured element painted nothing reported "dark". A light
      page asked to become dark then saw now === mode and returned: a silent no-op every time,
      with a log line asserting the page was already correct. Three earlier fixes in this batch
      were all downstream of a measurement that was confidently wrong. The guard is now on ALPHA
      rather than component count, several candidate elements are tried in order because which
      one carries the theme background is Streamlit's business and has moved between versions,
      and the last resort is the OS preference - which is what Streamlit follows when the URL
      names no theme. Harness: 10/10, including the exact regression.
      1.273 covers LEX_THEME_DEBUG, added because four rounds of this were debugged by inference:
      the mechanism spans three browsing contexts, is reported with screenshots, and console
      output was not reaching the diagnosis. A panel rendered IN the page makes one screenshot
      sufficient - it shows the measured background, the stored value, whether a widget has
      announced anything and by which route, and whether the reload budget is spent. Off by
      default, and SPLICED rather than gated: when off the panel code is absent, not
      present-and-skipped, so no production page carries it and no future edit to a runtime guard
      can leak a debug box into a dashboard. The scenario also pins that the follower is identical
      in both variants - diagnostics must observe the mechanism, never alter it.
  ae:
    title: Streamlit theme parity — tokens, native theme config, CLI wiring
    scenarios: 1.274-1.299
    status: complete
    tests:
      pass: 41
      skip: 0
      xfail: 0
    note: Streamlit pages now carry the real lex brand. Design tokens are vendored as pure Python
      (tokens.py) and mapped onto Streamlit 1.58's native theme keys (mapping.py) — ~120 keys exist,
      so the navy sidebar, dataframe header, chart palettes, radii and fonts are all reachable through
      the PUBLIC config API rather than CSS. config_writer.py renders that one mapping two ways — CLI
      flags (primary — a config.toml resolves relative to CWD, so only flags theme every launch
      identically) and a generated .streamlit/config.toml (fallback for a bare `streamlit run`). The
      committed config was hand-written with every value drifted (primaryColor `#08BCC2` vs the real
      `#14b4b4`, grey sidebar vs navy, "sans serif" vs Inter, no dark mode); 1.293 makes that
      unrepeatable by asserting the file is byte-identical to the generator. Fonts point at the
      frontend's OWN Google Fonts stylesheet via Streamlit's "<family>:<url>" form, so the two
      surfaces agree both connected (both Inter) and air-gapped (both fall back) — bundling a woff2
      for Streamlit alone was rejected because the frontend does not bundle one either. 4 keys
      (chart ramps + showSidebarBorder) are global-only with no per-mode twin, pinned by 1.280b since
      Streamlit rejects unrecognised options outright. A broken theme never blocks a launch (1.292).
      Verified against real Streamlit — flags and generated TOML both accepted, launch survives a
      deliberately broken token module. Also fixes `lex streamlit` silently overriding a
      caller-supplied port — the hardcoded ports were appended AFTER the caller's args, so a
      custom port was ignored and the command was unusable wherever 8080 was already taken.
      The proxy's UPSTREAM now follows `--server.port`, so it cannot forward to a dead port
      (1.295-1.298). CLI flag values are emitted BARE — reusing the TOML encoder
      quoted them, so every colour arrived as `"#14b4b4"` and Streamlit silently skipped it as
      invalid; the theme applied nowhere while every shape-level check passed. 1.299 now asserts
      the values Streamlit actually RESOLVES. Streamlit's CLI cannot express list options at all,
      lists ARE expressible on the CLI (Streamlit json.loads them) so they stay JSON while
      scalars go bare, and the sequential/diverging ramps need EXACTLY 10 stops or Streamlit
      discards them for its own defaults — another silent skip (1.299c/1.299d).
      RENUMBERED ON MERGE 2026-08-28 - this branch claimed letter z and scenarios 1.211-1.236,
      and both landed on lex-app-v2 while it was open. Letter z is now the iframe-breakout batch
      (1.211-1.216) and aa took 1.217-1.222, so a duplicate z key here would have silently
      dropped one of them from the YAML. Kept as ae/1.274-1.299 so no scenario id means two
      different things. Second renumber for this batch - the first, to letter z, is in its own
      history, which is how the collision happened twice.
  af:
    title: The mode switch and the branded theme compose
    scenarios: 1.300-1.301
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      Found while merging 1ae (launch-time branding from LEX tokens) into 1ad (runtime mode switch
      via ?embed_options). Read separately, 1ad looks like it destroys 1ae: the URL option appears
      to select Streamlit's BUILT-IN light/dark, which would discard the brand on every theme
      follow. Verified in the Streamlit 1.58 bundle that it does not - the URL option is a
      preference SIGNAL, and the resolver prefers the custom variant of that mode
      (Light -> ["Custom Theme Light", "Light"], Dark -> ["Custom Theme Dark", "Dark"]). But those
      custom variants exist only when the config supplies BOTH [theme.light] and [theme.dark]; a
      config carrying only the flat [theme] section yields one unnamed custom theme that table
      cannot reach, and the switch would fall through to the built-in. So 1ad is safe BECAUSE 1ae
      populates both mode sections - a dependency neither batch states. Pinned here because the
      config is generated and collapsing it to one section would look harmless: the theme would
      still be right until someone switched mode. Second half guards the two mode vocabularies
      staying distinct ("dark" internally vs "dark_theme" in the URL), since Streamlit drops an
      unrecognised embed option silently.
      1.301 adds a THIRD theme mechanism, taken selectively from
      origin/feat/lex-brand-tokens-and-theme-handshake: lex_view(theme=) pushes the host's mode
      DOWN into an embedded lex-app iframe (?theme= boot fallback plus a host->iframe `theme`
      postMessage on load). Exact inverse authority to 1ad - there the Streamlit author decides,
      here lex-app does - and they coexist because the envelopes differ by source tag
      ("lex-app-host" down, "lex-app" up) and neither listens to the other, so no loop. Only the
      SENDING half was taken, and only because the rest of that branch is superseded: its
      733-line design_system/lex_tokens.py predates the 787-line version that landed on
      lex-app-v2 via #686 with a CI freshness gate, so merging the branch whole would have been a
      54-line regression. DOCUMENTED GAP, asserted rather than implied: the React app reads
      neither ?theme= nor the postMessage, so lex_view(theme=) is currently inert on the frontend
      while looking like it works - it validates its input, appears in the URL, and does nothing.
      Delete that third assertion and replace it with an effect test when the consumer lands.
  ag:
    title: SPA assets are cacheable, and responses are compressed
    scenarios: 1.302-1.303
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      User report - "the loading speed, it seems that it's taking way too long". Measured rather
      than guessed: the built SPA is ONE chunk of 6281 KB (1895 KB gzipped), and lex/react/views.py
      serve_react stamped EVERY file it served with "no-store, no-cache, must-revalidate,
      max-age=0". no-store is the strongest form - the browser may keep no copy at all - so
      nothing was reused between page loads and nothing was shared between a page and the iframes
      inside it. A Streamlit page with three lex-app widgets therefore re-fetched ~24 MB on every
      load (6.3 x (3+1)), and the same again on the next one; thirteen widgets would be ~86 MB.
      Hashed assets are content-addressed, so they are safe to cache forever and same-origin
      iframes share one HTTP cache: assets matching -<hash>. now get
      "public, max-age=31536000, immutable". Everything else keeps no-store, and that half is
      tested just as hard, because inverting the split is WORSE than the original bug - a pinned
      index.html names hashed bundles that a deploy has replaced, giving a blank app with 404s and
      no way to publish a correction. The hash is required rather than inferred from the directory
      for the same reason. GZipMiddleware added for the cold-cache path (6.3 MB -> 1.9 MB), pinned
      near the top of MIDDLEWARE since it compresses on the way out.
      NOT fixed here, and the next real win: the 6 MB chunk itself. src/index.tsx imports ag-grid
      at the entry and /embed/widgets is registered INSIDE <Admin> beside six <Resource>
      declarations, so a Calculate button loads AG Grid Enterprise, ten ra-* enterprise packages,
      moment and a markdown editor. Route-level React.lazy cannot help (the entry and <Admin> load
      first); it needs a separate Vite entry mounting <AdminContext> only. Its own import graph is
      78 modules.
  ah:
    title: Per-user metadata responses are briefly cacheable
    scenarios: 1.304-1.305
    status: complete
    tests:
      pass: 9
      skip: 0
      xfail: 0
    note: >-
      Follow-up to 1ag, from the user's network log: 171 requests for one Streamlit page, with
      api/model-structure fetched five to six times. Nothing was looping - each embedded lex-app
      frame is its own JS realm with its own query cache, so six widget blocks meant six
      independent runtimes each legitimately wanting the tree once, concurrently. That endpoint is
      also expensive to produce: it deepcopies the structure, then INSTANTIATES every model class
      and evaluates its list permission, per request. The browser HTTP cache is shared across
      same-origin frames, so "private, max-age=30" collapses N fetches to one with no client-side
      coordination and no shared-state machinery. private is load-bearing rather than tidy: the
      tree is pruned to the requesting user's permissions, so a shared cache serving it onward
      would disclose which models another user can see - a confidentiality bug, not a performance
      one, which is why 1.304 asserts it directly. Vary is extended rather than overwritten
      because DRF sets it for content negotiation and clobbering it misbehaves only under a cache.
      The window is a staleness budget for permission changes, so
      LEX_METADATA_CACHE_SECONDS=0 disables it outright; 1.305 pins that 0 means no-store rather
      than falling back to the default, and that a blank or malformed value cannot take the
      endpoint down. Also applied to model-styling, the same class of per-user metadata.
  ai:
    title: Component frames load without being scrolled to
    scenarios: 1.306-1.307
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      User report - "the components trigger when I scroll to them". The cause is in Streamlit
      1.58, not in the widgets: ComponentInstance renders every custom component's frame as
      styled('iframe')(({componentReady}) => ({display: componentReady ? 'initial' : 'none'})),
      so the frame is display:none until the code INSIDE it calls setComponentReady() - which it
      can only do once loaded. Browsers deprioritise hidden frames and commonly defer off-screen
      ones outright, so nothing fetches until scrolling changes visibility; Streamlit's skeleton
      placeholder is what was on screen. loading="eager" on our inner iframe cannot reach this,
      because that frame lives INSIDE the hidden one. Fix holds the frame open across its load -
      display:block, height:0, rendered but occupying nothing - and releases it the moment
      Streamlit writes a height, which only happens after ready. Deliberately inline and NOT
      !important: inline already beats the emotion class, and staying beatable is what lets
      Streamlit take the element back. 1.307 covers the part that makes this safe rather than
      merely effective - all three exits (ready, timeout, detached) go through one release path,
      because a frame left holding our styles would be permanently zero-height AFTER loading,
      i.e. an invisible widget instead of a slow one. Behaviour verified against DOM doubles
      (7 cases: nudge, leave-visible-alone, release-on-ready, release-on-timeout,
      release-on-detach, pick up frames from a later rerun, install once) - no JS runner in this
      repo, so that harness is not in CI.
