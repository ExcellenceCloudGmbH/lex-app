    note: >-
      follow-up to the iframe breakout (batch z) - makes the expiry dead end avoidable rather than
      merely graceful. StreamlitTokenView now publishes expires_in/expires_at/refresh_interval
      (previously only returned by dead code that self-signed HS256, which the RS256/JWKS proxy
      would reject) and 401s instead of KeyError-ing when the session has no OIDC token; the proxy
      adopts a strictly newer auth_token rather than discarding it while the stored one is still
      valid, which silently defeated any renewal. First two-letter batch id - cluster 1 exhausted
      a-z. Renumbered from z/1.201-1.206 on merge
  ab:
    title: Streamlit lex_calculation() widget — trigger one record and watch it
    scenarios: 1.223-1.266
    status: complete
    tests:
      pass: 44
      skip: 0
      xfail: 0
    note: >-
      native widget replacing "embed a whole React table just to click one button". Covers
      `lex/lex_app/streamlit/_client.py` (backend URL resolution, per-thread pooled session, bearer token
      read from the host's `session_state["access_token"]`, `LexApiError`), the new `_status_poller.py`
      (the session-owned thread that does every read and every trigger) and `calculation.py` (the render,
      status presentation, optimistic click), plus the package `__init__` as the public surface (1.240).
      Gates the three properties a dashboard depends on. Polling self-terminates: `poll_interval_for`
      returns None on every terminal status and on a failed read, and the poller stops asking about a
      settled record while re-arming when the reader triggers one (1.228-1.229, 1.256, 1.262). No failure
      path raises out of the widget - Streamlit renders top-to-bottom, so an escaping exception erases
      every widget below it (1.232, 1.236, 1.243-1.244, and 1.266 drives a total outage through the real
      runtime). And neither the widget nor the poller imports a Django model, so read permission, audit
      actor and the `_defer_calculate_hook` trigger path stay identical to the React UI's (1.238);
      `calculate` travels in the PATCH body, not the query string (1.235). 1.247-1.250 close the disabled-
      with-reason gap: the button is drawn disabled with the backend's reason beside it when the
      envelope's `can_calculate` is false (1.247), still disabled while a run is in progress for the
      separate double-trigger reason (1.248), still relays a 403 that arrives after the click because only
      the PATCH is authoritative and the envelope is a read old (1.249), and left enabled when the key is
      absent, so a backend older than the flag does not disable everyone's button (1.250). Pairs with
      batch 10o, the status endpoint it reads. 1.251-1.266 are the usability pass, and they replace an
      earlier one that did not work: after it, the reader still reported tiles hanging before they
      rendered, a Calculate button that never looked interactive, and every other section greying whenever
      one calculation ran. The earlier pass had cached reads and moved the timer decision earlier - it was
      treating a symptom. Both faults were the render path doing what a render path must not, and the rule
      that ends them is one sentence: the render performs no I/O and reruns nothing but itself. No I/O -
      Streamlit runs a page on one thread, so a tile reading its own status inside the render holds up
      every tile below it, in series, before any of them exist; all reads and triggers moved to a daemon
      thread the session owns, leaving the render a dictionary lookup (1.251-1.253, and 1.264 asserts no
      read lands on the script's own thread). No page reruns - `run_every` is heard only at declaration
      and only a full run declares, so adapting the timer to the status requires rerunning the page, and
      `st.rerun()` raises, taking every widget still to be drawn with it: one click cost fourteen script
      runs and 104 reads. The timer is now declared unconditionally and never rebuilt (1.230, 1.245-1.246,
      1.265). One deliberate rerun remains, once per record per session when the first read lands, so that
      branching on the return value is true on a freshly opened page; `sync_page=True` opts one tile into
      following its record thereafter. It is guarded by a call-stack flag rather than session_state,
      because the poller fills snapshots on another thread and a record can go from unknown to known
      between an app-scope check and the fragment body - which reintroduced the exact cascade. A click
      renders "Running" from the accepted trigger rather than after a re-read (1.254), gives it back if
      refused (1.249) and yields to the next real read (1.255). The per-session boundary now covers a
      bearer token as well as status envelopes: the poller lives in session_state, never cache_resource or
      module state (1.261), and the polling thread never touches `st` at all (1.260). Measured in a
      browser, 13 tiles over 6 records against a 300ms backend: whole-page render seconds to 17ms, reads
      on the render thread 13 to 0, click-to-"Running" ~7s to 103ms, full script runs caused by a click 14
      to 0, page greyed seconds-at-a-time to 0.8% of wall clock in ~20ms flickers.