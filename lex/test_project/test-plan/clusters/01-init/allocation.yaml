    scenarios: 1.195-1.200
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: management command that surgically re-anchors user-entered datetimes mis-stored after the
      rc212 TIME_ZONE flip (f622c9c); dry-run by default, PER-INSTANCE window [--cutoff, --until)
      (--cutoff required, no global default — too-early corrupts good data; --until defaults to now),
      excludes app-stamped created_at/edited_at. Correction is DST-aware (AT TIME ZONE per value's own
      date — winter −1h vs summer −2h); the ~2 transition hours/year are flagged for review. 1.197
      late-upgrader safety, 1.198 post-fix bound, 1.199 DST-aware winter shift, 1.200 transition-flag.
      Ships with the USE_TZ=True cutover.
  r:
    title: Fetched datetimes come back in the DB-session display zone (Berlin)
    scenarios: 1.201-1.202
    status: complete
    tests:
      pass: 2
      skip: 0
      xfail: 0
    note: DATABASES['default']['TIME_ZONE'] = TIME_ZONE runs the Postgres session in Berlin, so a
      fetched DateTimeField returns aware in the display zone (11:00+02:00) not UTC — str()/.date()/.hour
      and model __str__ render local with no per-field/per-model changes; storage + instant unchanged.
      Postgres-only guard; Django date-part lookups use explicit AT TIME ZONE so bitemporal/as_of raw
      SQL is unaffected (history+serializers+init+exports 385 pass with it live).
  y:
    title: Streamlit theme parity — tokens, native theme config, CLI wiring
    scenarios: 1.203-1.223
    status: complete
    tests:
      pass: 32
      skip: 0
      xfail: 0
    note: Streamlit pages now carry the real lex brand. Design tokens are vendored as pure Python
      (tokens.py) and mapped onto Streamlit 1.58's native theme keys (mapping.py) — ~120 keys exist,
      so the navy sidebar, dataframe header, chart palettes, radii and fonts are all reachable through
      the PUBLIC config API rather than CSS. config_writer.py renders that one mapping two ways — CLI
      flags (primary — a config.toml resolves relative to CWD, so only flags theme every launch
      identically) and a generated .streamlit/config.toml (fallback for a bare `streamlit run`). The
      committed config was hand-written with every value drifted (primaryColor `#08BCC2` vs the real
      `#14b4b4`, grey sidebar vs navy, "sans serif" vs Inter, no dark mode); 1.222 makes that
      unrepeatable by asserting the file is byte-identical to the generator. Fonts point at the
      frontend's OWN Google Fonts stylesheet via Streamlit's "<family>:<url>" form, so the two
      surfaces agree both connected (both Inter) and air-gapped (both fall back) — bundling a woff2
      for Streamlit alone was rejected because the frontend does not bundle one either. 4 keys
      (chart ramps + showSidebarBorder) are global-only with no per-mode twin, pinned by 1.209b since
      Streamlit rejects unrecognised options outright. A broken theme never blocks a launch (1.221).
      Verified against real Streamlit — flags and generated TOML both accepted, launch survives a
      deliberately broken token module.
