  o:
    title: Error bodies, OIDC redirects, unknown api/ paths, global search ?q=, one KeycloakManager
    scenarios: 10.83-10.90
    status: complete
    tests:
      pass: 8
      skip: 0
      xfail: 0
    note: >-
      v2 security hardening. TRACEBACKS (10.83-10.84): no traceback in generic error bodies unless
      DEBUG, LEX_API_TRACEBACKS=true or the opt-out; error text kept; the explicit switch wins over
      DEBUG. OIDC_REDIRECT (10.85-10.86): next/fail on /oidc/* relative, own host, CSRF_TRUSTED_ORIGINS
      or the CORS allow-list, else 400 REDIRECT_NOT_ALLOWED before the OIDC view. Unknown api/ path is
      a JSON 404, SPA routes keep index.html (10.87-10.88). api/global-search/?q= routed (10.89). One
      KeycloakManager per process (10.90). Ported from #815, #821 (manager only), #830.
  p:
    title: The fields endpoint's value_list flag, and no filter bar
    scenarios: 10.91-10.92
    status: complete
    tests:
      pass: 2
      skip: 0
      xfail: 0
    note: >-
      Every descriptor of GET api/model_info/<model>/fields carries value_list, computed by
      value_list_field -- the resolver filter_values uses (lex/api/utils/filterable_fields.py) --
      for the serializer the list renders through (UserModelSerializer for auth.User); a field with
      no column behind it is false (10.91: char, integer, boolean, date, FK and choice true;
      TextField, decimal, JSON, credential-shaped, write-only and renamed fields false; every column
      of ValueListOptOutItem and AuditLog false; auth.User's flags agree with what filter_values
      accepts). Merged with lex-app-v2: value_list also asks the filter allow-list (LEX_SEC_FILTERS)
      whether the caller may filter by the column (4.123); 10.91 builds its own container, so its
      helper points the allow-list at that container.
      Native column filters (spec Amendment 18): the grid's own column filters are the only filter
      UI, so list_ui.filter_bar is withdrawn -- Meta.filter_bar, a model's filter_bar,
      _resolve_filter_bar and the fields endpoint's per-caller narrowing. 10.92 pins that list_ui
      has no filter_bar key for a model and a serializer that still declare one, while every field
      keeps value_list. The bar's scenarios (Meta.filter_bar, the model fallback, dropped names, a
      filter_bar that is not a list) and their fixture FilterBarColumnItem are gone, 10.94 became
      10.91, the file is test_10p_fields_value_list_flag.py, and test_10i's 10.25 and test_12e's
      12.35 pin lex-app-v2's list_ui dicts again.
