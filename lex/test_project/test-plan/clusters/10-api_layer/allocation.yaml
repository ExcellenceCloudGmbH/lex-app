  o:
    title: Error bodies, OIDC redirects, unknown api/ paths, global search ?q=, one KeycloakManager
    scenarios: 10.83-10.90
    status: complete
    tests:
      pass: 8
      skip: 0
      xfail: 0
    note: >-
      v2 security hardening. TRACEBACKS (10.83-10.84): no traceback in generic error bodies unless
      DEBUG, LEX_API_TRACEBACKS=true or the opt-out; error text kept; the explicit switch wins over
      DEBUG. OIDC_REDIRECT (10.85-10.86): next/fail on /oidc/* relative, own host, CSRF_TRUSTED_ORIGINS
      or the CORS allow-list, else 400 REDIRECT_NOT_ALLOWED before the OIDC view. Unknown api/ path is
      a JSON 404, SPA routes keep index.html (10.87-10.88). api/global-search/?q= routed (10.89). One
      KeycloakManager per process (10.90). Ported from #815, #821 (manager only), #830.
  p:
    title: File-download endpoints write an audit entry
    scenarios: 10.91-10.96
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      Four endpoints serve a file and each has its own machine. `file-download` on local storage
      records the record, field, filename, byte size and `delivery: stream` (10.91); a refused
      download is a `failure` entry with its status code and no record attached (10.92); on GCS the
      caller gets a URL, recorded as `delivery: url` so "bytes streamed" and "access handed out"
      stay distinguishable (10.93). The SharePoint download (10.94), share link (10.95) and preview
      link (10.96) are audited as downloads too, told apart by `delivery`. SharePoint's SDK is mocked
      at the project boundary; `DownloadableDocument` is the cluster's own FileField model.
  q:
    title: The Process and ProcessFlow endpoints are gone from the route table
    scenarios: 10.97-10.99
    status: complete
    tests:
      pass: 3
      skip: 0
      xfail: 0
    note: >-
      Removing the Process feature took out two public routes and must have taken out nothing else.
      api/run_step/<model>/<pk> no longer reverses, no route is named run_step or served under
      api/run_step/, and lex.api.views.process_flow no longer imports (10.97). The same for
      api/process/<name>, plus ProcessStructure gone from lex.process_admin.views and
      lex.api.views.ModelStructureObtainView (10.98). The endpoints the bundled frontend loads a
      project with -- model-structure, project-info, calculationlog-tree, init-calculation-logs,
      clean-calculations, widget-structure, global-search-query, user-permissions, log and
      htmlreports -- all still reverse (10.99). This resolves pending decision 4 in clusters/README
      for CreateOrUpdate. The model-side removal is pinned by 1ax. Originally allocated as
      10p/10.91-10.94; #840 landed that letter and range on lex-app-v2 first, so this batch re-took
      the next free pair on merge.
  r:
    title: api/htmlreport/<name> hands a report the request, and the Streamlit frame a credential
    scenarios: 10.100-10.102
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      The Streamlit sidebar entry framed its dashboard host with no credential at all. A
      cross-origin frame cannot authenticate itself -- the proxy would have to redirect it to
      Keycloak, which forbids being framed -- so the frame 401'd and the framed-401 page took the
      browser tab to the dashboard host. The report now carries the session's own OIDC access
      token as the bootstrap auth_token (10.100), the same handshake the React shell's embed has
      always used, and carries none at all when the session has none (10.101) rather than a
      placeholder the proxy must reject. The route answers Cache-Control: no-store now that its
      body can hold a credential (10.100). HTMLReport's published get_html(self, user) is untouched:
      the request reaches only a report that declares a second parameter, decided by reading the
      signature rather than catching a TypeError that could have come from inside the report
      (10.102). Mutation: the pre-fix report fails 10.100.
  ad:
    title: "model_info ships the project's per-column display options"
    scenarios: "10.184-10.187"
    tier: U
    status: complete
    tests: {pass: 5, skip: 0, xfail: 0}
    note: >-
      LEX-1556. A customer reported the grid's ID column is too wide, and the framework had no
      way for a project to say anything about a COLUMN: ``list_ui`` carried one flag
      (``hide_actions_column``). ``Meta.lex_column_options`` is the missing developer layer -
      width / min_width / max_width / pinned / hidden per field - and this batch covers the
      half a frontend actually reads: ``/api/<model>/fields/`` returning it.
      10.184 the declaration arrives keyed by field name. 10.185 a project's own PLAIN DRF
      serializer gets the identical contract, because the endpoint serves both kinds and a
      frontend that had to tell them apart would need two code paths for one payload - and the
      hand-written kind is the one that would be missed. 10.186 every response answers the key,
      so "declared nothing" and "declared an empty thing" cannot diverge between readers.
      10.187 a malformed declaration costs the project that option and not the grid: this
      payload is fetched before any table can be drawn, so an exception raised while describing
      a DISPLAY PREFERENCE would take down every list view of the model.
      Paired with cluster 12p (the serializer-side contract and its validation) and frontend
      clusters F03p/F03q.

