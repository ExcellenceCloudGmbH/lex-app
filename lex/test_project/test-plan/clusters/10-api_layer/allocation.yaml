  o:
    title: Read-only calculation-status endpoint for the Streamlit widget
    scenarios: 10.72-10.84
    status: complete
    tests:
      pass: 13
      skip: 0
      xfail: 0
    note: >-
      `GET /api/model_entries/<model:model_container>/<int:pk>/calculation-status` - the
      narrow read `lex_calculation()` polls, in `views/calculations/CalculationStatus.py`.
      Reads are filtered through `UserReadRestrictionFilterBackend`, the same backend list
      reads use, rather than a hand-rolled check - read permission here is a queryset
      filter, not a boolean. A record the caller may not read therefore returns the same 404
      status AND the same body as one that does not exist (10.76); a distinguishable
      response would confirm the record exists and leak its calculation state. Terminal
      statuses stay distinct - ABORTED and CANCELLED are not collapsed into ERROR (10.73).
      The log tail is opt-in behind `?include_log=true`, so the 2-second poll never runs the
      `CalculationLog` query by default (10.77), is bounded to `LOG_TAIL_LIMIT=50` with an
      accurate `log_truncated` flag from one over-fetched row rather than a second COUNT
      (10.78-10.79), and is scoped - like the run timings, which the record itself does not
      carry - to the newest `calculationId`, so a re-run's tail carries none of the previous
      run's lines (10.80-10.81). 10.82-10.83 add `can_calculate` /
      `calculate_denied_reason`, the flag the widget draws its button from: read permission
      cannot answer "may this caller run it", so the endpoint instantiates
      `UserPermission` - the permission class `OneModelEntry` itself declares - and
      evaluates it against the trigger's own `{"calculate":"true"}` payload rather than
      re-deriving the rule. Both scenarios also issue the real PATCH, because a flag that
      disagrees with `One.update` lies in one direction or the other: enabled-then-403 is
      recoverable, disabled-when-allowed is a dead end. Pairs with batch 1ab, the widget
      that polls it.
