    title: Global search with the Reflex report registered
    scenarios: '10.82'
    status: complete
    tests:
      pass: 1
      skip: 0
      xfail: 0
    note: >-
      With IS_REFLEX_ENABLED=true the Reflex HTMLReport is registered beside Streamlit, and the global
      search walks every container. Without 'reflex' in EXCLUDED_MODELS the search reads the report's
      _meta and fails with AttributeError -- every frontend search a 500 -- which is how 10.82 fails
      against the tree without the exclusion.
