  i:
    title: A calculation row learns its latest run
    scenarios: 15.39-15.46
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      Reported as "once they are done, we lose the logs and we would have to do a lot of steps to get
      them." Literally true: the live log is served from cache and the root calculation purges that
      cache on completion (CacheManager.cleanup_calculation), so a finished run had no path back from
      the row that started it. The durable copy was always in the CalculationLog table; what was
      missing was the row knowing which run to open. The grid endpoint now annotates calculation rows
      with lex_reserved_calculation_id / lex_reserved_has_calculation_log, one query per page, by the
      rule the frontend's useResolvedCalculationId already applies - newest calculationId starting
      "<model>_<pk>_", by id - so one row opens one run in the table and in every widget. 15.44 is the
      regression; 15.42 is the guard against it becoming N+1; 15.46 guards the index that makes the
      prefix match a probe rather than a scan. No migration: calculationId has been db_index=True since
      0005. 15.43's second half exists because the first implementation shadowed the audit log's own
      getter: _wrap_custom_serializer builds (LexSerializer, custom_cls), so a same-named method on the
      shared base came first in the MRO and unannotated audit rows answered False. The fields now name
      their getters explicitly.
  j:
    title: A failed run keeps what it logged
    scenarios: 15.47-15.50
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      Review of the calculation log popup: "Why is there no display of the calculation logs from the
      successful parts of the calculation until it raises an error?" CalculationLog persists on commit,
      so a calculation that fails inside its transaction - every is_atomic model - was rolled back with
      every row it wrote, and the steps that succeeded vanished with the one that failed. The live cache
      is not transactional: it holds the run's whole log under the root's key until the run ends.
      CalculationLog.keep_rolled_back_log writes that text back as the run's log in both failure paths
      (execute_calculation_sync's finally, calculate_hook's except), just before the cache is purged.
      15.47 is the regression; 15.48 is what the log popup reads - the audit row's
      lex_reserved_has_calculation_log - turning true; 15.49 leaves surviving rows alone; 15.50 makes
      an empty or raising cache cost the log, never the failure path. These unpatch the harness's cache
      stubs (store_message, build_cache_key), which otherwise make every key "test_key" and store
      nothing.

  k:
    title: The grid opens the log of a run a create started
    scenarios: '15.51'
    status: complete
    tests:
      pass: 1
      skip: 0
      xfail: 0
    note: >-
      A run started by creating a record is filed under <model>_<pk>_update_<uuid>, the prefix the list
      view's latest-run lookup reads, so the new row's log button opens it. Filed under the create
      request's own id (<model>_create_<uuid>, no pk), the row could never find it.
  l:
    title: The calculation-log PDF download writes an audit entry
    scenarios: 15.52-15.55
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      Downloading a log as PDF is recorded against the log itself, with the PDF's name and size and
      `include_descendants: false` (15.52). A subtree download records that scope plus the section
      count — "one log" and "a log and everything under it" are different amounts of data leaving
      the system (15.53). A rendering failure is a `failure` entry with the 500 and no delivered
      size (15.54), and a log the caller may not see is a recorded refusal keeping the 404's
      traceback, with nothing attached (15.55).
  m:
    title: A generated row's log is filed under that row — synchronous routes
    scenarios: 15.56-15.62
    status: complete
    tests:
      pass: 7
      skip: 0
      xfail: 0
    note: >-
      BUG-052 and BUG-053. Since eec74b6d (2026-05-14) no batch consumer put the row it calculated on the model
      context stack, so every generated row's lines were filed under the root. 15b-15e pinned that
      and failed unnoticed, because no CI job ran this cluster. All three consumers now run each row
      inside CalculationModel.child_calculation_context. With a non-atomic root, lines are written
      before a new row has a pk; such a row now gets a node of its own, kept on the instance and
      linked to the record when its block ends. Before eec74b6d those siblings were merged into one
      node with no record. Covers the materialising route (15.56), immediate writes on both routes
      (15.57, 15.58), a re-run keyed by the stored rows (15.59), a middle that logs only after its
      grandchild, atomic and not (15.60, 15.61), and a failing row (15.62). Each scenario was
      checked to fail with the matching part of the fix undone.
  n:
    title: A generated row's log is filed under that row — Celery route
    scenarios: 15.63-15.64
    status: complete
    tests:
      pass: 2
      skip: 0
      xfail: 0
    note: >-
      Eager Celery, as in cluster 8h. A worker writes every line immediately and works on a copy of
      the stack. 15.63: a root running in the generic calc_and_save task finds a copy of itself on
      top and is not pushed again (ModelContext.has_on_top), while each dispatched row gets its own
      node. 15.64: a middle row that dispatches its grandchildren before logging is unsaved when the
      stack is copied; copy_for_dispatch creates its node first, so every worker files under the same
      node. Checked to fail without the guard (15.63, 15.64) and without the node created before
      the copy (15.64).
  o:
    title: A nested CalculationModel's synchronous run is not taken for the root
    scenarios: 15.65-15.71
    status: complete
    tests:
      pass: 7
      skip: 0
      xfail: 0
    note: >-
      BUG-055. calculate_hook gives a CalculationModel it runs synchronously a frame of its own
      (child_calculation_context), from the run through the terminal bookkeeping in
      execute_calculation_sync and the failure handling in calculate_hook. Both decide from the stack
      whether the run is the root. Without the frame, a nested model was taken for the root. Covers a
      nested model that finishes and leaves the run's live log alone (15.65), a run that fails in a
      nested model and keeps its log (15.66), a nested failure the caller handles and that leaves one
      root node (15.67), and a root saved with nothing on the stack, which gets a node of its own and
      keeps its log when it fails (15.68, 15.69). It also covers the API route, a background thread in
      a copy of the request context where the root is not pushed twice (15.70), and the Celery route,
      which gives the same tree (15.71). 15.65 and 15.66 purge the live log as Redis does, which the
      test cache cannot. Checked against the undone fix: no frame fails 15.65-15.70 and 15.19-15.21;
      a frame around calculate() only fails 15.65, 15.66, 15.67 and 15.69; a frame that ends before
      the failure handling fails 15.66 and 15.67; a frame pushed when the model is already on top fails
      15.19-15.21, 15.67 and 15.70. 15.71 passes without the fix too: it guards the agreement of the routes.
  p:
    title: A CalculationModel dispatched to Celery runs in a frame of its own
    scenarios: 15.72-15.77
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      BUG-056. Eager Celery, as in 15n. calculate_hook now opens child_calculation_context before it
      either dispatches the run or runs it, and closes it in its finally, so the task is shipped a copy
      of the stack with the model on top, and the hook's failure handling, which runs in the caller's
      thread when the task failed, sees the model on top. Covers a nested model whose calculate() is a
      @lex_shared_task, which gets its own node (15.72), and what it saves on the worker, which nests
      under it (15.73); a decorated root saved with nothing on the stack, which gets a node keyed to its
      record and closes its audit entry as a success (15.74); the generic task giving such a root the
      same node (15.75); and a nested failure the root handles, which leaves the run's live log alone on
      the generic task (15.76) and on the decorated route (15.77). Checked against the undone fix: no
      frame on the Celery route fails 15.72-15.74, 15.76 and 15.77; a frame that ends before the
      failure handling fails 15.76 and 15.77; the rejected alternative, a push of args[0] in the
      lex_shared_task wrapper, fails 15.76 and 15.77; calc_and_save pushing a model already on top
      fails 15.72, 15.73 and 15.75-15.77 (and 15.63, 15.64, 15.71). 15.75 passes without the fix: it
      guards the agreement of the routes.
