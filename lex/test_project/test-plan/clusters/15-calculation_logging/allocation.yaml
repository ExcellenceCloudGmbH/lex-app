  i:
    title: A calculation row learns its latest run
    scenarios: 15.39-15.46
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      Reported as "once they are done, we lose the logs and we would have to do a lot of steps to get
      them." Literally true: the live log is served from cache and the root calculation purges that
      cache on completion (CacheManager.cleanup_calculation), so a finished run had no path back from
      the row that started it. The durable copy was always in the CalculationLog table; what was
      missing was the row knowing which run to open. The grid endpoint now annotates calculation rows
      with lex_reserved_calculation_id / lex_reserved_has_calculation_log, one query per page, by the
      rule the frontend's useResolvedCalculationId already applies - newest calculationId starting
      "<model>_<pk>_", by id - so one row opens one run in the table and in every widget. 15.44 is the
      regression; 15.42 is the guard against it becoming N+1; 15.46 guards the index that makes the
      prefix match a probe rather than a scan. No migration: calculationId has been db_index=True since
      0005. 15.43's second half exists because the first implementation shadowed the audit log's own
      getter: _wrap_custom_serializer builds (LexSerializer, custom_cls), so a same-named method on the
      shared base came first in the MRO and unannotated audit rows answered False. The fields now name
      their getters explicitly.
  j:
    title: A failed run keeps what it logged
    scenarios: 15.47-15.50
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      Review of the calculation log popup: "Why is there no display of the calculation logs from the
      successful parts of the calculation until it raises an error?" CalculationLog persists on commit,
      so a calculation that fails inside its transaction - every is_atomic model - was rolled back with
      every row it wrote, and the steps that succeeded vanished with the one that failed. The live cache
      is not transactional: it holds the run's whole log under the root's key until the run ends.
      CalculationLog.keep_rolled_back_log writes that text back as the run's log in both failure paths
      (execute_calculation_sync's finally, calculate_hook's except), just before the cache is purged.
      15.47 is the regression; 15.48 is what the log popup reads - the audit row's
      lex_reserved_has_calculation_log - turning true; 15.49 leaves surviving rows alone; 15.50 makes
      an empty or raising cache cost the log, never the failure path. These unpatch the harness's cache
      stubs (store_message, build_cache_key), which otherwise make every key "test_key" and store
      nothing.

