  k:
    title: A credential-shaped column never reaches a response
    scenarios: 12.49-12.53
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      LEX-702 / BUG-F-033 backend half. auth.User was served through model_entries WITH its Django
      password hash, and the LEAST-privileged account could read the MOST-privileged account's --
      verified on a clean harness, HTTP 200. The FK hover card then painted it wherever a grid held
      an FK to User.
      NOT a permission bypass, and that is the whole point of the cluster. Field-level read scoping
      works correctly on that endpoint (admin gets nav, the restricted viewer's payload omits the
      key). Two things went around it: UserModelSerializer is a plain DRF ModelSerializer and not a
      LexSerializer, so can_read / permission_read never ran for it at all; and a model declaring
      neither hook falls through to "all fields" even inside LexSerializer. So the fix cannot be a
      permission rule -- it is a name-based refusal, at two enforcement points, plus an allowlist
      replacing fields = "__all__".
      Matching is exact-name plus unambiguous suffixes, deliberately NOT the substring search the
      frontend's hover-card denylist uses: `hash` would swallow content_hash and `auth` would
      swallow author, and a silently missing field is its own bug. 12.53 pins both directions.
      There WAS a unit test asserting Meta.fields == "__all__" -- it encoded the bug. Rewritten
      inverted in lex/tests/unit/api/test_model_entry_provider_mixin.py.
  j:
    title: Datetime write→read round trip under the aware-UTC convention
    scenarios: 12.46-12.48
    status: complete
    tests:
      pass: 3
      skip: 0
      xfail: 0
    note: live regression gates for the USE_TZ=True cutover — a client that sends an explicit instant
      (the fixed frontend's toISOString) gets that exact moment back, rendered in the viewer's zone;
      summer round trip, year-end midnight across the winter offset, and a truthful designated instant.
      Frontend twin datetimeConventionRoundTrip.test.ts.
  l:
    title: The FK display name on every request the grid, History tab and Summary tab send
    scenarios: 12.54-12.57
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: >-
      The frontend never fetches the related record to label a foreign key: it renders the
      <fk>__short_description companion (batch 12i) and shows the raw id when it is missing. 12i pinned
      the plain GET list and detail; these pin the requests the screens send -- the grid's AG Grid POST
      (12.54), the History tab's grid on historical<model>, where each version names the FK it held
      (12.55), the Summary tab's ?serializer=default (12.56), and a serializer the project declared in
      api_serializers, which _wrap_custom_serializer still bases on LexSerializer (12.57). Mutations:
      silencing the list companion fails 12.54-12.55, silencing the single-record companion fails
      12.56-12.57, wrapping a project serializer without LexSerializer fails 12.57.
