  f:
    title: Export renders datetimes in the requester's browser timezone
    scenarios: 13.31-13.33
    status: complete
    tests:
      pass: 3
      skip: 0
      xfail: 0
    note: Excel has no tz type, so aware-UTC datetimes must be baked as a local wall-clock at export
      time. Both write paths render in the requester's zone (frontend sends `timezone` on the export
      request) — legacy pandas (_to_excel_naive) and streaming/fast (_normalize_cell_value) — falling
      back to settings.TIME_ZONE for absent/invalid. Ships with the USE_TZ=True cutover.
  g:
    title: Report-file Excel boundary renders and re-reads the display zone
    scenarios: 13.34-13.37
    status: complete
    tests:
      pass: 4
      skip: 0
      xfail: 0
    note: XLSXField.create_excel_file_from_dfs crashed on the aware datetimes USE_TZ=True introduced
      ("Excel does not support datetimes with timezones"). _excel_display_naive renders aware values
      as settings.TIME_ZONE wall-clock and strips tzinfo -- data columns, object columns, (multi)index
      and column headers. Round-trip proven — a cell read back from the file re-assigned to a LexModel
      DateTimeField restores the exact original instant via the 3g invariant.
  h:
    title: Report-file fields are callable from the value, and wide enough for report paths
    scenarios: 13.38-13.45
    status: complete
    tests:
      pass: 8
      skip: 0
      xfail: 0
    note: Two independent traps in the same declaration. XLSXField's helpers are written against a
      FieldFile (create_excel_file_from_dfs ends in self.save(..., save=False)) but lived only on the
      field class, so self.report.create_excel_file_from_dfs(...) raised AttributeError and only the
      unbound XLSXField.create_excel_file_from_dfs(self.report, ...) worked. attr_class = XLSXFieldFile
      binds the same function objects, so both spellings resolve to one implementation. Separately
      XLSXField.max_length = 300 was dead -- FileField.__init__ setdefaults 100 and Field.__init__
      shadows the class attribute -- so every bare XLSXField()/PDFField() was varchar(100), over which
      Django's storage silently truncates and suffixes the filename. Both fields now setdefault their
      advertised width. Downstream apps get one AlterField per report column on their next
      makemigrations.
  i:
    title: The export endpoint writes an audit entry
    scenarios: 13.46-13.51
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      `post` reaches the file through four machines that share no code between request and response,
      so each is asserted on its own: universal streaming (13.46), flat DB-only streaming (13.47),
      the AG-Grid pandas fallback (13.50) and the legacy non-AG path (13.49). Every entry carries the
      rows and columns that actually left the system, the file size and the request's shape; the
      model fixes the entry's content type while `object_id` stays unset, because a model-wide export
      touches no single record. An export that returns no file is a `failure` entry with its status
      code (13.48), and a hand-picked selection is recorded as a count, never as the id list (13.51).
  j:
    title: An export under a value-list filter holds the rows the list shows
    scenarios: '13.52'
    status: complete
    tests:
      pass: 1
      skip: 0
      xfail: 0
    note: >-
      The grid, its export and Select All read one filter model; the export paths filter through
      ListModelEntries._apply_filter_model, the list's own Set and Multi translation (14k). 13.52
      lists and exports under a Set ticking one category and blank, and under an empty selection,
      on the pandas path (ExportItem, its own permission_export) and the universal streaming path
      (FastExportItem with the export scope, as in 13e): the sheet holds exactly the list's rows
      (alpha and the blank row), and nothing ticked exports nothing -- the export's "No data" 404.
      A pin of behaviour the 14k translation already gives the export. Mutations: the pre-14k Set
      translation (blanks dropped, empty selection ignored) fails it, and so does an export that
      drops the grid's filter model while the list keeps it (both subtests).
      Allocation: first 13i/13.46. lex-app-v2 landed 13i (13.46-13.51) while this branch was open,
      so the batch moved to the next free letter on merge.
