  x:
    title: Per-user Keycloak calls stay with their user; forged tokens and look-alike paths get no access
    scenarios: 4.138-4.147
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      UMA permissions and userinfo were requested through python-keycloak, which sets the caller's
      token on the process-wide connection before sending, so concurrent requests could receive
      another user's answer (BUG-038). They now go through lex/api/keycloak/uma_client.py, the token
      on its own request: 4.138 (240 concurrent middleware requests, 12 users, a stub Keycloak echoing
      the token's user) and 4.139 (the KeycloakManager path Streamlit and the token views use).
      4.140-4.143 classify Keycloak's answers and pin TLS verification and timeouts. 4.144: an HS256
      token signed with the client secret no longer signs anyone in, RS256 from the identity provider
      still does (BUG-035). 4.145-4.147: login exemptions are anchored, so /api/user_permissions/ and
      any path containing /health need a signed-in user again while the real public endpoints stay
      public (BUG-036). Mutation, with KeycloakManager.py, keycloak_permissions.py and settings.py put
      back to HEAD: 4.138 and 4.139 fail with other users' permissions and profiles; 4.140 (None, not
      []), 4.142 (an unreachable Keycloak goes unlogged), 4.144 (no RS256-only setting), 4.146 (6
      look-alike paths skip sign-in) and 4.147 (14 unanchored patterns) fail too; 4.141, 4.143 and
      4.145 pass. Letter x, not s-w: those are in flight on feat/multi-value-filters (s, t) and the
      feat/ext-* branches (s-w, scenarios up to 4.137). Same letter and IDs on lex-app-v2 and
      release/2.1.x.
