  n:
    title: Keycloak UMA permissions in Reflex dashboards
    scenarios: 4.75-4.79
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      current_permissions / has_permission / current_access_token (lex/lex_app/reflex/auth.py) -- the
      Reflex counterpart of st.session_state.permissions, which the Streamlit proxy fills. One
      KeycloakManager lookup per access token, again after a refresh; a failed lookup keeps the same
      user's grants and never hands them to another user; sign-out clears them; has_permission counts
      model-wide grants on <app_label>.<ModelName> only, as the API's default read check does. Each of
      five mutations of that code (keep grants across users, keep them across sign-out, count record
      grants, cache the raw token, return the cached list itself) fails exactly one scenario.
  o:
    title: Secure defaults on the generic REST endpoints (v2 security hardening)
    scenarios: 4.80-4.100
    status: complete
    tests:
      pass: 20
      skip: 0
      xfail: 0
    note: >-
      lex/core/security_flags.py (nine flags, LEX_LEGACY_SECURITY umbrella, LEX_SEC_<FLAG> override,
      is_superuser_or_admin) and lex/api/security.py. FAIL_CLOSED (4.80-4.81), NOT_FOUND incl. bulk
