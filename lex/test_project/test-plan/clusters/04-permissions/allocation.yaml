  n:
    title: Keycloak UMA permissions in Reflex dashboards
    scenarios: 4.75-4.79
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      current_permissions / has_permission / current_access_token (lex/lex_app/reflex/auth.py) -- the
      Reflex counterpart of st.session_state.permissions, which the Streamlit proxy fills. One
      KeycloakManager lookup per access token, again after a refresh; a failed lookup keeps the same
      user's grants and never hands them to another user; sign-out clears them; has_permission counts
      model-wide grants on <app_label>.<ModelName> only, as the API's default read check does. Each of
      five mutations of that code (keep grants across users, keep them across sign-out, count record
      grants, cache the raw token, return the cached list itself) fails exactly one scenario.
  o:
    title: "Generic API gate and OIDC redirect guard"
    scenarios: 4.80-4.85
    status: complete
    tests:
      pass: 6
      skip: 0
      xfail: 0
    note: >-
      The guard accepts the bundled frontend's absolute next URLs (window.location.href) because the
      frontend is served from the site's own origin or a configured dev origin.
  p:
    title: "Secure permission defaults on the generic REST API"
    scenarios: 4.86-4.103
    status: complete
    tests:
      pass: 18
      skip: 0
      xfail: 0
    note: >-
      No new denial answers 403: the bundled frontend signs the user out on 403, so unreadable records are
      404 and refused writes 400. Single-record visibility uses permission_read for the record (the
      decision the serializer made before), so classic API keys keep reading what they could read.
