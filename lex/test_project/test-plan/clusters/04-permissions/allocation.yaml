  n:
    title: Keycloak UMA permissions in Reflex dashboards
    scenarios: 4.75-4.79
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      current_permissions / has_permission / current_access_token (lex/lex_app/reflex/auth.py) -- the
      Reflex counterpart of st.session_state.permissions, which the Streamlit proxy fills. One
      KeycloakManager lookup per access token, again after a refresh; a failed lookup keeps the same
      user's grants and never hands them to another user; sign-out clears them; has_permission counts
      model-wide grants on <app_label>.<ModelName> only, as the API's default read check does. Each of
      five mutations of that code (keep grants across users, keep them across sign-out, count record
      grants, cache the raw token, return the cached list itself) fails exactly one scenario.
  o:
    title: Secure defaults on the generic REST endpoints (v2 security hardening)
    scenarios: 4.80-4.100
    status: complete
    tests:
      pass: 20
      skip: 0
      xfail: 0
    note: >-
      lex/core/security_flags.py (nine flags, LEX_LEGACY_SECURITY umbrella, LEX_SEC_<FLAG> override,
      is_superuser_or_admin) and lex/api/security.py. FAIL_CLOSED (4.80-4.81), NOT_FOUND incl. bulk
      GET dropping unreadable ids (4.82-4.84), EDIT on PATCH and bulk PATCH/DELETE with
      400 {code, detail, error} bodies (4.85-4.89, BUG-010), READ_SURFACES on history, search,
      export, file download and the HTML report endpoint (4.91-4.95), BUG-011 once-per-row
      (4.96), API-key read context (4.97), flag resolution (4.98), admin helper (4.99), signed-out
      callers keep their sign-in answer (4.100). Ported from #816 without the 3.0 extension hooks.
      2026-10-22: 4.90 is RETIRED -- it pinned run_step alone, and the ProcessFlow endpoint was
      removed with the Process feature (10q pins its absence). The scenario id is not reused.
      Pass 21 -> 20.
  p:
    title: Internal tools, Django users, permission_list and history writes (v2 security hardening)
    scenarios: 4.101-4.110
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      LEX_SEC_INTERNAL: delete-unused-files for superusers and the Keycloak client role admin (4.101),
      POST api/logs for superusers (4.102), the calculation-log tree and its PDF only for logs of
      readable records (4.103-4.104), auth.User writes for superusers (4.105). permission_list false
      answers 404 (4.106, LEX_SEC_NOT_FOUND). LEX_SEC_HISTORY_WRITE: PATCH/PUT/POST/DELETE and bulk writes
      on Historical*/MetaHistorical* rows answer 400 EDIT_NOT_ALLOWED for non-superusers
      (4.107-4.110). Against the tree without these changes 8 of 10 fail (4.109 and 4.110 pin the
      opt-out and the unaffected main record). Ported from #826 (B2-B4, A9) with B1 widened to the
      admin role; E1 is new. 2026-10-22: 4.105 creates through the CRUD endpoint and 4.108 dropped
      its run_step probe -- the ProcessFlow endpoint was removed with the Process feature (10q).
      Both scenarios keep every other write path; pass stays 10.
  q:
    title: permission_create on the record the request fills (LEX_SEC_CREATE)
    scenarios: 4.111-4.115
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      The create endpoint asks permission_create a second time, on the record filled with the
      request's validated values (foreign keys set), before the audit entry and pre_validation: a
      refusal answers the blank check's 401/403 {message} and stores nothing (4.111, 4.113); the hook
      sees the blank, then the filled unsaved record (4.112); a hook raising there refuses with 500
      under FAIL_CLOSED (4.114); LEX_SEC_CREATE=false / LEX_LEGACY_SECURITY=true keep the blank check
      only (4.115). 4.98 now lists ten flags. 4.111-4.114 fail on lex-app-v2 0ac01da8; 4.115 passes on
      both.
