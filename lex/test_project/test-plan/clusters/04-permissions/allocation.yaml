  n:
    title: Keycloak UMA permissions in Reflex dashboards
    scenarios: 4.75-4.79
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      current_permissions / has_permission / current_access_token (lex/lex_app/reflex/auth.py) -- the
      Reflex counterpart of st.session_state.permissions, which the Streamlit proxy fills. One
      KeycloakManager lookup per access token, again after a refresh; a failed lookup keeps the same
      user's grants and never hands them to another user; sign-out clears them; has_permission counts
      model-wide grants on <app_label>.<ModelName> only, as the API's default read check does. Each of
      five mutations of that code (keep grants across users, keep them across sign-out, count record
      grants, cache the raw token, return the cached list itself) fails exactly one scenario.
  o:
    title: Secure defaults on the generic REST endpoints (v2 security hardening)
    scenarios: 4.80-4.100
    status: complete
    tests:
      pass: 21
      skip: 0
      xfail: 0
    note: >-
      lex/core/security_flags.py (nine flags, LEX_LEGACY_SECURITY umbrella, LEX_SEC_<FLAG> override,
      is_superuser_or_admin) and lex/api/security.py. FAIL_CLOSED (4.80-4.81), NOT_FOUND incl. bulk
      GET dropping unreadable ids (4.82-4.84), EDIT on PATCH, bulk PATCH/DELETE and run_step with
      400 {code, detail, error} bodies (4.85-4.90, BUG-010), READ_SURFACES on history, search,
      export, file download and the HTML report endpoint (4.91-4.95), BUG-011 once-per-row
      (4.96), API-key read context (4.97), flag resolution (4.98), admin helper (4.99), signed-out
      callers keep their sign-in answer (4.100). Ported from #816 without the 3.0 extension hooks.
  p:
    title: Internal tools, Django users, permission_list and history writes (v2 security hardening)
    scenarios: 4.101-4.110
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      LEX_SEC_INTERNAL: delete-unused-files for superusers and the Keycloak client role admin (4.101),
      POST api/logs for superusers (4.102), the calculation-log tree and its PDF only for logs of
      readable records (4.103-4.104), auth.User writes for superusers (4.105). permission_list false
      answers 404 (4.106, LEX_SEC_NOT_FOUND). LEX_SEC_HISTORY_WRITE: PATCH/PUT/POST/DELETE, bulk and
      run_step on Historical*/MetaHistorical* rows answer 400 EDIT_NOT_ALLOWED for non-superusers
      (4.107-4.110). Against the tree without these changes 8 of 10 fail (4.109 and 4.110 pin the
      opt-out and the unaffected main record). Ported from #826 (B2-B4, A9) with B1 widened to the
      admin role; E1 is new.
  o:
    title: filter_values honours row and field read permissions
    scenarios: 4.80-4.87
    status: complete
    tests:
      pass: 8
      skip: 0
      xfail: 0
    note: >-
      Value lists come from filter_values, outside the serializer that hides fields per row in the
      grid. RowFieldItem hides region on private rows and denies hidden rows. 4.80 counts region
      only where readable, 4.81 never counts hidden rows, 4.82 gives an empty list for a field
      readable on no row, 4.83 refuses a field the requested serializer does not expose. Mutation:
      forcing _count_per_row's readable-field membership test to always succeed fails 4.80 and 4.82.
      Final review -- only what the grid renders can be listed: value_list_field now takes the
      requested serializer instance and refuses a write-only field, extra_kwargs or HiddenField
      (4.84), a field whose class takes get_attribute or to_representation from outside
      rest_framework -- DRF's Serializer.to_representation calls both on every field; no framework
      field class overrides either for a value-list column type, so nothing is whitelisted (4.85,
      one subtest per method), and every field of a serializer whose class hierarchy defines
      to_representation outside LexSerializer and DRF (4.86). The whole MRO is walked because a wrapped custom serializer puts LexSerializer ahead
      of the custom class; the framework's id-only wrapper carries KEEPS_FIELD_VALUES. 4.87 pins the
      read filter on the database path: KeycloakItem keeps both read methods at the LexModel
      default, and a record-level UMA grant on one of three rows lists only that row's label.
      Mutation: FilterValues.filter_queryset patched to the identity fails 4.87 alone; the other
      seven pass, because the per-row check also drops denied rows.
