      on Historical*/MetaHistorical* rows answer 400 EDIT_NOT_ALLOWED for non-superusers
      (4.107-4.110). Against the tree without these changes 8 of 10 fail (4.109 and 4.110 pin the
      opt-out and the unaffected main record). Ported from #826 (B2-B4, A9) with B1 widened to the
      admin role; E1 is new. 2026-10-22: 4.105 creates through the CRUD endpoint and 4.108 dropped
      its run_step probe -- the ProcessFlow endpoint was removed with the Process feature (10q).
      Both scenarios keep every other write path; pass stays 10.
  q:
    title: permission_create on the record the request fills (LEX_SEC_CREATE)
    scenarios: 4.111-4.115
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      The create endpoint asks permission_create a second time, on the record filled with the
      request's validated values (foreign keys set), before the audit entry and pre_validation: a
      refusal answers the blank check's 401/403 {message} and stores nothing (4.111, 4.113); the hook
      sees the blank, then the filled unsaved record (4.112); a hook raising there refuses with 500
      under FAIL_CLOSED (4.114); LEX_SEC_CREATE=false / LEX_LEGACY_SECURITY=true keep the blank check
      only (4.115). 4.98 now lists ten flags. 4.111-4.114 fail on lex-app-v2 0ac01da8; 4.115 passes on
      both.
  r:
    title: A raising permission hook denies on the remaining surfaces (LEX_SEC_FAIL_CLOSED)
    scenarios: 4.116-4.120
    status: complete
    tests:
      pass: 5
      skip: 0
      xfail: 0
    note: >-
      4o made raising hooks deny on the record endpoints; four places still allowed. Now, under
      FAIL_CLOSED: an audit-log entry whose record's permission_read raises is hidden (4.116,
      can_read_from_payload); a payload reference to a record whose permission_read raises is dropped
      (4.117); a payload whose filtering raises is withheld as {} (4.118); a row whose
      permission_export raises is left out of the export (4.119); PermissionAwareSerializerMixin
      refuses an edit/create whose check raises (4.120). LEX_SEC_FAIL_CLOSED=false restores the allow
      in each. All five fail on fix/audit-log-read-side-v2 (lex-app-v2 0ac01da8 + #842). 4.111-4.115 are
      reserved for 4q (permission_create on the filled record, separate PR).
  x:
    title: Per-user Keycloak calls stay with their user; forged tokens and look-alike paths get no access
    scenarios: 4.138-4.147
    status: complete
    tests:
      pass: 10
      skip: 0
      xfail: 0
    note: >-
      UMA permissions and userinfo were requested through python-keycloak, which sets the caller's
      token on the process-wide connection before sending, so concurrent requests could receive
      another user's answer (BUG-038). They now go through lex/api/keycloak/uma_client.py, the token
      on its own request: 4.138 (240 concurrent middleware requests, 12 users, a stub Keycloak echoing
      the token's user) and 4.139 (the KeycloakManager path Reflex, Streamlit and the token views
      use). 4.140-4.143 classify Keycloak's answers and pin TLS verification and timeouts. 4.144: an
      HS256 token signed with the client secret no longer signs anyone in, RS256 from the identity
      provider still does (BUG-035). 4.145-4.147: login exemptions are anchored, so
      /api/user_permissions/ and any path containing /health need a signed-in user again while the
      real public endpoints stay public (BUG-036). Mutation, with KeycloakManager.py,
      keycloak_permissions.py and settings.py put back to HEAD: 4.138 and 4.139 fail with other users'
      permissions and profiles; 4.140 (None, not []), 4.142 (an unreachable Keycloak goes unlogged),
      4.144 (no RS256-only setting), 4.146 (6 look-alike paths skip sign-in) and 4.147 (14 unanchored
      patterns) fail too; 4.141, 4.143 and 4.145 pass. Letter x, not s-w: those are in flight on
      feat/multi-value-filters (s, t) and the feat/ext-* branches (s-w, scenarios up to 4.137). Same
      letter and IDs on lex-app-v2 and release/2.1.x.
  y:
    title: The permission lookup is lazy, cached per token, single-flight and never a silent deny
    scenarios: 4.148-4.158
    status: complete
    tests:
      pass: 11
      skip: 0
      xfail: 0
    note: >-
      request.user_permissions / userinfo / client_roles are lazy (4.148); UMA answers are cached per
      SHA-256 of the access token, never shared across users and never mutated through a request
      (4.149), for at most min(60 s, the token's lifetime) (4.150), one call per token at a time
      with waiters sharing success and failure (4.151). Keycloak's answers: access_denied is []
      and the user stays signed in (4.152), a rejected token is 401 session_expired (4.153), an
      outage 503 auth_unavailable - before the view for writes, nothing stored, still signed in
      afterwards (4.154). UMA has its own breaker (keycloak_uma): it opens after repeated failures,
      a probe closes it, the token endpoint's breaker is untouched, and an issuer mismatch through
      KEYCLOAK_INTERNAL_URL is a configuration outage, never a 401 sign-in loop (4.155). Roles come
      from the access token's resource_access and the profile from the sign-in, with no userinfo
      call and no stale session value (4.156). guarded() and every fail-closed site (list filter,
      detail, create, update, delete, export) answer an auth outage with its 503/401 instead of a
      denial or a grant, with LEX_SEC_FAIL_CLOSED on and off (4.157, 4.158). Also updated for 2.5,
      intent unchanged unless noted: 4g 4.31-4.34 (the seam is a sign-in and the UMA call; 4.32b
      now expects AuthUnavailable instead of a silent []; 4.33 checks role shapes from the token;
      4.34 checks that session tokens are never used), 4x 4.138 (bearer contexts; one override for
      all threads), 4.141/4.142 (401 session_expired / 503 instead of []), 4.144 (a FakeOP access
      token as the control, the forgery carries iss/aud/typ), 4.145-4.147 (a view's own 401 now
      carries login_url too; OIDC_LOGIN_REQUIRED_EXEMPT_URL_PATTERNS), 4o 4.98 (eleven flags), 4q
      4.111 (the create refusal keeps message and adds detail and code permission_denied).
      Letter y: s-w are held by in-flight branches (see x).
  aa:
    title: The Streamlit token carries the caller's own Keycloak permissions
    scenarios: 4.163-4.163
    status: complete
    tests:
      pass: 1
      skip: 0
      xfail: 0
    note: >-
      StreamlitTokenView imported KeycloakManager relative to lex/authentication/views, where no such
      module exists; the ImportError was swallowed, so every Streamlit token carried no permissions.
      It now uses lex.api.views.authentication.KeycloakManager (the per-request UMA client of 4x) and
      maps None to []. Mutation: with the relative import back, 4.163 fails. Letter aa and 4.163, not
      y/z or 4.148-4.162: those belong to open PRs #869 (4y) and #880 (4z).
      Rewritten for lex-app 2.5 (#869), same intent: the view now hands out the caller's own
      sign-in token, so 4.163 checks two signed-in callers each get exactly their own token with
      their own client roles, and that the view asks Keycloak for nothing.
