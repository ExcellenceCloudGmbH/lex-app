name: Celery Redis Broker Example

# ──────────────────────────────────────────────────────────────────────
#  Small broker-backed Celery release-gate example.
#
#  This is owned by pip_publish.yml. It proves the one boundary the default
#  Celery clusters avoid: producer -> Redis broker -> in-process Celery
#  worker -> Redis result backend, including the CalculationModel +
#  WaitForTasks path.
# ──────────────────────────────────────────────────────────────────────

on:
  workflow_call:
  workflow_dispatch:

jobs:
  redis-broker-example:
    name: Redis-backed Celery broker example
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: lundadminlocal
          POSTGRES_DB: db_lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: lex_app.settings
      DATABASE_DEPLOYMENT_TARGET: default
      CELERY_ACTIVE: "False"
      LEX_RUN_REDIS_CELERY_TESTS: "true"
      LEX_CELERY_REDIS_TEST_URL: redis://127.0.0.1:6379/15

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.0"

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev pkg-config \
            libpango-1.0-0 libpangoft2-1.0-0

      - name: Install lex-app
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.txt
          pip install -e .

      - name: Flush Redis test DB
        run: |
          python - <<'PY'
          import redis

          redis.Redis.from_url("redis://127.0.0.1:6379/15").flushdb()
          PY

      - name: Run Redis broker integration examples
        run: |
          python -m lex test \
            lex.test_project.tests.celery_async.test_8k_redis_broker_integration \
            --verbosity=2 \
            --noinput

