# ──────────────────────────────────────────────────────────────────────
#  Frontend build pipeline — runs AFTER the backend test suite passes.
#
#  This workflow:
#   1. Calls django_tests.yml (reusable) to gate on backend health.
#   2. Checks out the frontend from process-admin-general-client
#      (branch: lex-app-v2-pac-latest by default, configurable).
#   3. Runs the Vitest unit-test suite with a coverage threshold.
#   4. Runs Playwright E2E tests against a real Django backend
#      (reuses the Python env where `lex` is already installed).
#   5. On success: `yarn build` → copies the build output into
#      lex/react/build/ and commits the updated bundle.
#
#  Required secrets:
#   - NPM_MARMELAB_TOKEN   (for the private @marmelab npm registry)
#   - FRONTEND_REPO_TOKEN  (PAT with read access to the frontend repo,
#                           or use secrets.GITHUB_TOKEN if same org + SSO)
#   - LEX_PACKAGES_TOKEN   (read:packages for @excellencecloudgmbh/* on
#                           GitHub Packages; falls back to FRONTEND_REPO_TOKEN)
# ──────────────────────────────────────────────────────────────────────

name: Frontend Build

on:
  release:
    # `released`, NOT `published`: this build commits + pushes a fresh
    # frontend bundle, so it must run only for REAL releases. A release
    # is only ever cut once its gate is green (validate_and_release.yml),
    # so a `released` event always corresponds to a shipped version. The
    # `published` activity fires for pre-releases too, which would build
    # and push a bundle for something that never ships. `released` fires
    # only for full releases (and for promotion by un-checking
    # "pre-release"), which is exactly when a shipped bundle is wanted.
    types: [released]
  workflow_dispatch:
    inputs:
      frontend_branch:
        description: "Frontend branch to build"
        required: false
        default: "lex-app-v2-pac-latest"
        type: string

env:
  FRONTEND_REPO: ExcellenceCloudGmbH/process-admin-general-client
  FRONTEND_BRANCH: ${{ inputs.frontend_branch || 'lex-app-v2-pac-latest' }}
  COVERAGE_THRESHOLD: "76" # vitest line-coverage gate

jobs:
  # ── Step 0: Preflight — verify required secrets / inputs ───────────
  # The default GITHUB_TOKEN cannot read a *different* private repo
  # (process-admin-general-client), so a PAT in FRONTEND_REPO_TOKEN is
  # mandatory. Without it, actions/checkout reports a confusing
  # "repository not found" error. Fail fast with a clear message instead.
  preflight:
    name: "Preflight: Validate Secrets"
    runs-on: ubuntu-latest
    steps:
      - name: Ensure FRONTEND_REPO_TOKEN is configured
        env:
          FRONTEND_REPO_TOKEN: ${{ secrets.FRONTEND_REPO_TOKEN }}
        run: |
          if [ -z "${FRONTEND_REPO_TOKEN}" ]; then
            echo "::error title=Missing secret::FRONTEND_REPO_TOKEN is not set."
            echo "This workflow checks out '${FRONTEND_REPO}@${FRONTEND_BRANCH}',"
            echo "which is a *different* repository than the one running this workflow."
            echo "The default GITHUB_TOKEN cannot access cross-repository private content,"
            echo "so a Personal Access Token (or fine-grained token / GitHub App token)"
            echo "with 'Contents: read' permission on '${FRONTEND_REPO}' must be"
            echo "configured as the repository secret 'FRONTEND_REPO_TOKEN'."
            exit 1
          fi
          echo "FRONTEND_REPO_TOKEN is configured ✅"

      - name: Ensure NPM_MARMELAB_TOKEN is configured
        env:
          NPM_MARMELAB_TOKEN: ${{ secrets.NPM_MARMELAB_TOKEN }}
        run: |
          if [ -z "${NPM_MARMELAB_TOKEN}" ]; then
            echo "::error title=Missing secret::NPM_MARMELAB_TOKEN is not set."
            echo "Required to install private @marmelab packages from the npm registry."
            exit 1
          fi
          echo "NPM_MARMELAB_TOKEN is configured ✅"

  # ── Step 1: Frontend unit tests ────────────────────────────────────
  unit-tests:
    name: "Frontend: Unit Tests"
    needs: preflight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend (lex)
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Configure GitHub Packages auth (LEX Design System)
        # The frontend consumes @excellencecloudgmbh/* from GitHub Packages.
        # Uses LEX_PACKAGES_TOKEN when configured, falling back to
        # FRONTEND_REPO_TOKEN (works when that PAT has read:packages).
        run: echo "//npm.pkg.github.com/:_authToken=${LEX_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          LEX_PACKAGES_TOKEN: ${{ secrets.LEX_PACKAGES_TOKEN || secrets.FRONTEND_REPO_TOKEN }}

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend
        env:
          NPM_MARMELAB_TOKEN: ${{ secrets.NPM_MARMELAB_TOKEN }}

      - name: Run Vitest with coverage gate
        run: yarn test --run --coverage --coverage.thresholds.lines=${{ env.COVERAGE_THRESHOLD }}
        working-directory: frontend
        env:
          NPM_MARMELAB_TOKEN: ${{ secrets.NPM_MARMELAB_TOKEN }}

  # ── Step 2: Playwright E2E tests (real Django backend) ─────────────
  e2e-tests:
    name: "Frontend: E2E Tests"
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout backend (lex)
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      # ── Python (lex CLI) ───────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies + lex CLI
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.txt
          pip install -e .

      # ── Node ───────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Configure GitHub Packages auth (LEX Design System)
        # The frontend consumes @excellencecloudgmbh/* from GitHub Packages.
        # Uses LEX_PACKAGES_TOKEN when configured, falling back to
        # FRONTEND_REPO_TOKEN (works when that PAT has read:packages).
        run: echo "//npm.pkg.github.com/:_authToken=${LEX_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          LEX_PACKAGES_TOKEN: ${{ secrets.LEX_PACKAGES_TOKEN || secrets.FRONTEND_REPO_TOKEN }}

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend
        env:
          NPM_MARMELAB_TOKEN: ${{ secrets.NPM_MARMELAB_TOKEN }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # ── Run Playwright (globalSetup handles migrate + seed) ────────
      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          CI: "true"
          DJANGO_SETTINGS_MODULE: e2e_project.e2e_settings
          PROJECT_ROOT: ${{ github.workspace }}/frontend/e2e/e2e_project
          DATABASE_DEPLOYMENT_TARGET: local
          PYTHONPATH: "${{ github.workspace }}/frontend/e2e:${{ github.workspace }}:${{ github.workspace }}/lex"

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7

  # ── Step 3: Build + commit bundle ──────────────────────────────────
  build-and-commit:
    name: "Build & Update Bundle"
    needs: [unit-tests, e2e-tests]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout backend (lex)
        uses: actions/checkout@v4
        with:
          # Need full history + write token for the commit step
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: ${{ env.FRONTEND_BRANCH }}
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Configure GitHub Packages auth (LEX Design System)
        # The frontend consumes @excellencecloudgmbh/* from GitHub Packages.
        # Uses LEX_PACKAGES_TOKEN when configured, falling back to
        # FRONTEND_REPO_TOKEN (works when that PAT has read:packages).
        run: echo "//npm.pkg.github.com/:_authToken=${LEX_PACKAGES_TOKEN}" >> ~/.npmrc
        env:
          LEX_PACKAGES_TOKEN: ${{ secrets.LEX_PACKAGES_TOKEN || secrets.FRONTEND_REPO_TOKEN }}

      - name: Install Node dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend
        env:
          NPM_MARMELAB_TOKEN: ${{ secrets.NPM_MARMELAB_TOKEN }}

      - name: Build production bundle
        run: yarn build
        working-directory: frontend

      - name: Copy build output into lex/react/build
        run: |
          # Wipe old build (except config.js which is runtime-injected)
          find lex/react/build -mindepth 1 ! -name 'config.js' -delete

          # Copy fresh build, skip config.js if it exists in the output
          rsync -a --exclude='config.js' frontend/build/ lex/react/build/

          echo "✅ lex/react/build updated:"
          ls -la lex/react/build/

      - name: Refresh vendored lex_tokens.py (LEX Design System)
        # The Python token export ships inside the @excellencecloudgmbh/lex-tokens
        # npm package the frontend just installed — keep the vendored host copy
        # (lex/lex_app/design_system/lex_tokens.py) in lockstep with the bundle.
        run: |
          SRC=frontend/node_modules/@excellencecloudgmbh/lex-tokens/dist/python/lex_tokens.py
          if [ -f "$SRC" ]; then
            cp "$SRC" lex/lex_app/design_system/lex_tokens.py
            VERSION=$(node -p "require('./frontend/node_modules/@excellencecloudgmbh/lex-tokens/package.json').version")
            sed -i "s/^Vendored from: .*/Vendored from: @excellencecloudgmbh\/lex-tokens@${VERSION}/" lex/lex_app/design_system/__init__.py || true
            echo "lex_tokens.py refreshed from lex-tokens@${VERSION}"
          else
            echo "lex-tokens python export not found in frontend deps — skipping refresh"
          fi

      - name: Commit updated bundle
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lex/react/build/ lex/lex_app/design_system/
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to bundle — skipping commit"
          else
            FRONTEND_SHA=$(cd frontend && git rev-parse --short HEAD)
            git commit -m "build(frontend): update bundle from ${FRONTEND_REPO}@${FRONTEND_SHA}"
            git push
          fi
