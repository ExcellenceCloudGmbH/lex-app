# ──────────────────────────────────────────────────────────────────────
#  Stage a release candidate — the VALIDATE half of the release flow,
#  built on GitHub's draft-release mechanics.
#
#  The problem this solves:
#    A git tag is a pointer to one commit. If you cut a tag/pre-release
#    up front and the gate fails, the tag is "spent" — and the moment you
#    fix code, the tag points at the wrong commit, so you must delete and
#    recreate it. Pre-creating the tag is the root of all the friction.
#
#  The trick — drafts don't mint a tag:
#    A DRAFT release stores a version name + a target commitish but does
#    NOT create the git tag until it is published. So we keep ONE draft
#    for the next version and simply re-point its target at the latest
#    VALIDATED commit, as often as we like. No tag exists yet, so:
#      * there is never a "duplicate tag" wall, and
#      * the candidate is never stale — it always points at a green commit.
#
#  What this workflow does, per run (workflow_dispatch):
#    1. Runs the full release gate (showcase_tests.yml) against the commit
#       this workflow was dispatched on (github.sha). Publishes NOTHING.
#    2. If — and only if — the gate is green, ensures a DRAFT release for
#       `version` exists and re-points its target_commitish at that exact
#       validated commit (stage_release_draft.py).
#
#  Shipping it (separate, deliberate human step):
#    Open the draft in the Releases UI and click "Publish release" as a
#    FULL (non-pre-release) release. GitHub mints the tag at the draft's
#    target — the validated commit — and fires `release: released`, which
#    pip_publish.yml consumes to publish to PyPI. Because the tag is born
#    only at publish time, a failed candidate never leaves a tag behind and
#    the same `version` can be re-staged indefinitely.
#
#  Required secrets: inherited by showcase_tests.yml — see that file.
# ──────────────────────────────────────────────────────────────────────

name: Stage Release Candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to stage as a draft (e.g. v2.0.0rc185)"
        required: true
        type: string
      clusters:
        description: >-
          Cluster selector fed to the gate (same syntax as
          run_showcase_suite.py --only). Defaults to all 13 clusters.
        required: false
        type: string
        default: >-
          init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries

jobs:
  # ── Validate the dispatched commit against the same gate pip_publish
  #    uses. No publish job lives here, so nothing reaches PyPI. ───────
  gate:
    name: "Candidate Gate: Tests + Customer Email"
    uses: ./.github/workflows/showcase_tests.yml
    secrets: inherit
    with:
      clusters: ${{ inputs.clusters || 'init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries' }}
      # Surfaced in the email subject so recipients can tell a candidate
      # validation apart from an actual release run.
      run_kind: prerelease

  # ── On green, point the draft for `version` at the validated commit.
  #    Skipped automatically if the gate job failed (needs: gate). ────
  stage-draft:
    name: "Stage / re-target draft at validated commit"
    needs: gate
    if: needs.gate.outputs.overall_ok == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create / edit releases (draft → no tag is created)
    steps:
      - name: Checkout (for the staging script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure / re-target draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/stage_release_draft.py \
            --repo "$GITHUB_REPOSITORY" \
            --version "${{ inputs.version }}" \
            --sha "${{ github.sha }}"
