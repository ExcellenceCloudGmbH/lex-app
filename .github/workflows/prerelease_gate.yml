# ──────────────────────────────────────────────────────────────────────
#  Prerelease Gate — validate a release candidate WITHOUT any PAT.
#
#  The operator flow this implements:
#    1. You cut a *prerelease* in the GitHub UI (tag vX.Y.ZrcN, "Set as a
#       pre-release" ticked). Creating it mints the tag immediately and
#       fires `release: prereleased`, which starts this workflow.
#    2. This runs the SAME release gate pip_publish.yml uses
#       (showcase_tests.yml). No publish happens here — it only decides
#       go / no-go for that exact prerelease commit.
#       * RED  → the `cleanup-on-red` job DELETES the prerelease and its
#                tag with the default GITHUB_TOKEN (no PAT, no org scope —
#                deleting a ref in this repo only needs `contents: write`).
#                The version name is reclaimed: fix the code and re-cut the
#                same prerelease.
#       * GREEN → the `mark-validated` job stamps a `lex:gate-passed`
#                marker into the prerelease body, then leaves it for you.
#    3. You eyeball the green prerelease and flip it to a full release in
#       the UI (untick "pre-release" / "Set as the latest release").
#
#  Why no PAT (this is the whole point):
#    Flipping a prerelease to a full release fires `release: released`.
#    That single event drives the existing publish chain on its own:
#      * pip_publish.yml      → builds + uploads to PyPI
#      * frontend_build.yml   → builds + commits the frontend bundle
#      * custom-image.yml     → builds the Docker image + deploys to env
#                               (triggers on pip_publish's success).
#    The recursion guard that suppresses `released` only applies to events
#    raised by GITHUB_TOKEN. The promotion here is done by YOU in the UI —
#    a human actor, not GITHUB_TOKEN — so `released` fires normally and the
#    chain proceeds. Nothing in this flow needs a PAT.
#
#  Single gate (no redundant re-run): pip_publish.yml SKIPS its own gate
#  when the release body carries `lex:gate-passed`. The `mark-validated`
#  job below stamps exactly that marker on green, so when you promote, the
#  publish runs directly instead of re-running the full suite. (If the
#  marker is ever absent — e.g. you promote something this workflow did not
#  green-stamp — pip_publish gates it as normal. Defense in depth.)
#
#  Required secrets: only those inherited by showcase_tests.yml (SendGrid,
#  recipients, optional Keycloak). No PAT.
# ──────────────────────────────────────────────────────────────────────

name: Prerelease Gate

on:
  release:
    # `prereleased` fires ONLY when a pre-release is created. A full
    # release fires `released`/`published` (not `prereleased`), so promoting
    # a prerelease to a full release does NOT re-trigger this gate — it goes
    # straight to the publish chain instead.
    types: [prereleased]

jobs:
  # ── Run the authoritative release gate against the prerelease commit. ──
  # ── Pick the cluster selector. Normally the standard 13 clusters; if
  #    you put [gate-selftest] in the prerelease title or notes, the
  #    always-failing `gate_selftest` cluster is appended so you can prove
  #    the RED → cleanup path on purpose (see cleanup-on-red below). ──────
  select-clusters:
    name: "Pick cluster selector"
    runs-on: ubuntu-latest
    outputs:
      clusters: ${{ steps.pick.outputs.clusters }}
    steps:
      - id: pick
        env:
          NAME: ${{ github.event.release.name }}
          BODY: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          BASE="init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries"
          # Opt-in self-test: a prerelease whose title OR notes contain the
          # literal [gate-selftest] appends the gate_selftest cluster, which
          # always fails — turning the gate red so cleanup-on-red deletes the
          # prerelease + tag. Normal prereleases run only the standard 13.
          if printf '%s\n%s' "$NAME" "$BODY" | grep -qF '[gate-selftest]'; then
            echo "clusters=${BASE},gate_selftest" >> "$GITHUB_OUTPUT"
            echo "[gate-selftest] marker found — appending the always-failing gate_selftest cluster."
          else
            echo "clusters=${BASE}" >> "$GITHUB_OUTPUT"
            echo "No [gate-selftest] marker — running the standard 13 clusters."
          fi

  gate:
    name: "Release Gate: Tests + Customer Email"
    needs: select-clusters
    uses: ./.github/workflows/showcase_tests.yml
    secrets: inherit
    with:
      clusters: ${{ needs.select-clusters.outputs.clusters }}
      # The prerelease gate is the release-day status update, same as the
      # pip_publish gate, so the stakeholder email is sent as a release run.
      run_kind: release

  # ── GREEN: stamp the marker so the eventual promotion skips the
  #    (redundant) pip_publish gate and publishes directly. ──────────────
  mark-validated:
    name: "Stamp gate-passed marker (green)"
    needs: gate
    if: ${{ needs.gate.outputs.overall_ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # edit the prerelease body
    steps:
      - name: Append lex:gate-passed marker to the prerelease body
        env:
          # GITHUB_TOKEN is fine: editing a release body fires only
          # `release: edited` (which this workflow does not listen for),
          # so there is no event to trigger and no recursion guard to dodge.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.event.release.target_commitish }}
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          if printf '%s' "$BODY" | grep -q 'lex:gate-passed'; then
            echo "Marker already present on $TAG — nothing to do."
            exit 0
          fi
          # Keep the marker text in sync with the `contains(...)` check in
          # pip_publish.yml's gate-release job.
          {
            printf '%s\n\n' "$BODY"
            printf 'Prerelease gate passed for `%s` via Prerelease Gate.\n\n' "$TAG"
            printf 'Promote this prerelease to a full release (untick "pre-release"\n'
            printf 'in the UI) to ship it. The PyPI publish gate is skipped because\n'
            printf 'the same gate already ran and passed here; see pip_publish.yml.\n\n'
            printf '<!-- lex:gate-passed tag=%s commit=%s -->\n' "$TAG" "$SHA"
          } > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          echo "Stamped lex:gate-passed on $TAG — promote it to ship."

  # ── RED: delete the prerelease AND its tag so the version is reclaimed.
  #    Uses only GITHUB_TOKEN + contents:write — no PAT, no org scope. ────
  cleanup-on-red:
    name: "Delete failed prerelease + tag (red)"
    needs: gate
    if: ${{ always() && needs.gate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # delete the release and the tag ref
    steps:
      - name: Delete the failed prerelease and its tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # --cleanup-tag removes the git tag along with the release. The
          # explicit ref delete is a belt-and-suspenders fallback in case
          # the release is gone but the tag somehow outlived it.
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" 2>/dev/null \
            && echo "Removed lingering tag ref $TAG." \
            || echo "Tag $TAG already gone (cleaned up with the release)."
          echo "Deleted failed prerelease $TAG; the version name is free to re-cut."

  # ── GREEN: draft the business-facing release note into the prerelease
  #    body, below the gate marker. The human who promotes the release is
  #    already reading this page, so review costs no extra step.
  #
  #    Never fails the gate. A changelog generator that can turn a release
  #    red is worse than one that occasionally emits a stub.
  draft-notes:
    name: "Draft release notes (green)"
    needs: [gate, mark-validated]
    if: ${{ needs.gate.outputs.overall_ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # edit the prerelease body
      models: read           # GitHub Models inference
      pull-requests: read    # digest._lookup_pr reads commits/{sha}/pulls;
                             # unlisted permissions default to none, and
                             # contents:write does not cover this endpoint.
                             # Without it every lookup 403s and the digest
                             # silently degrades to raw commit subjects.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tags + full history are the input
          # Take the DRAFTING TOOLS from the default branch, not from the tag.
          #
          # A `release` event leaves GITHUB_SHA pointing at the tagged commit,
          # so a bare checkout pins .github/scripts/ to whatever existed when
          # the tag was cut — while the workflow YAML above always comes from
          # the default branch. The two then disagree, and fixes merged after
          # tagging never take effect: v2.1.7rc1 kept emitting pre-fix output
          # from a job running post-fix YAML, which reads as the fix not
          # working rather than as never having run.
          #
          # The commit range is computed from tag refs, which fetch-depth: 0
          # brings along regardless of which branch is checked out.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The frontend half of the digest is read from PAC's git log, so PAC has
      # to be on disk. Nothing has ever passed --pac-checkout, which is the
      # only reason every release note so far has had an empty frontend
      # section. `path:` keeps this additive — the lex-app checkout above is
      # untouched.
      #
      # continue-on-error, for a mechanical reason rather than tidiness: the
      # next step reads only lex-app's own tags and never touches PAC, but a
      # hard failure here would skip it via the default `if: success()` — so a
      # token problem would silently cost us a working warning as well.
      #
      # FRONTEND_REPO_TOKEN is the credential documented for reading PAC:
      # the default GITHUB_TOKEN is scoped to lex-app alone and cannot read
      # a different private repo. Configured 2026-09-02.
      - name: Checkout the frontend repository
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: ExcellenceCloudGmbH/process-admin-general-client
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: pac
          fetch-depth: 0   # a commit RANGE is the input; a shallow clone cannot answer
          fetch-tags: true   # the range is a pair of PAC TAGS now, not shas.
                             # fetch-depth: 0 brings branch history but does
                             # not guarantee tags; without them
                             # `git log v1.10.0..v1.11.0` fails with a bad
                             # revision, degrading every release to a gap
                             # for a reason nobody would look for.

      # Reports, never fails — a missing range must not turn a release red.
      # Runs before drafting so the person promoting the prerelease sees the
      # warning while they can still act on it.
      - name: Verify frontend provenance
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PYTHONPATH=.github/scripts python -m release_notes verify-frontend --tag "$TAG"

      - name: Draft the note
        id: draft
        continue-on-error: true
        env:
          # Which model writes the note is configuration, not code. Set the
          # repository variable LEX_NOTES_PROVIDER to anthropic / gemini /
          # openai / github-models to pin one, or leave it unset for "auto",
          # which takes the first provider whose key is present, in that order.
          # A secret of the same name is honoured too, for orgs that prefer to
          # keep the choice out of the UI.
          #
          # Only the keys you set need to exist; unset ones are simply skipped.
          # With none of them, drafting fails open with a visible notice rather
          # than blocking the release.
          LEX_NOTES_PROVIDER: ${{ vars.LEX_NOTES_PROVIDER || secrets.LEX_NOTES_PROVIDER }}
          # Optional: override the model for whichever provider is chosen.
          # Defaults are the reasoning tier, not the fast tier — deciding
          # what is user-facing and what to merge is judgement work.
          LEX_NOTES_MODEL: ${{ vars.LEX_NOTES_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # -e matters here: without it a crash in the drafter still exits 0,
          # `continue-on-error` never fires, and the next step happily posts an
          # empty note and stamps the idempotence marker — turning a loud
          # failure into a silent one that also blocks any retry.
          set -euo pipefail
          PYTHONPATH=.github/scripts python -m release_notes draft-notes \
            --tag "$TAG" --pac-checkout ./pac > drafted.md
          test -s drafted.md
          echo "Drafted $(wc -l < drafted.md) lines."

      # Runs whatever happened above. Gating this on the drafter succeeding is
      # what turned the first real run into silence: the drafter crashed on a
      # missing style file, this step skipped, and the prerelease carried no
      # note and no explanation. `notes.draft()` guarantees a usable body, but
      # only once it is reached — anything that dies earlier needs a signal
      # here, or the failure is invisible to the person about to promote.
      - name: Append the note (or a failure notice) to the prerelease body
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          DRAFT_OUTCOME: ${{ steps.draft.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body')
          if printf '%s' "$BODY" | grep -q 'lex:notes-drafted'; then
            echo "Notes already drafted for $TAG — leaving the human's edits alone."
            exit 0
          fi

          # `notes.draft()` guarantees a usable body, so a SOFT failure — a
          # model response its validator rejected — still exits 0 and still
          # writes drafted.md. It marks itself with lex:notes-draft-failed.
          # Reading that marker is the only thing separating a real draft from
          # a fallback here; without it a soft failure gets stamped as a
          # success and, per the note below, becomes permanent. v2.1.9 is the
          # run that proved this wire was missing.
          DRAFT_OK=no
          if [ "$DRAFT_OUTCOME" = "success" ] && [ -s drafted.md ] \
             && ! grep -q 'lex:notes-draft-failed' drafted.md; then
            DRAFT_OK=yes
          fi

          if [ "$DRAFT_OUTCOME" = "success" ] && [ -s drafted.md ]; then
            # Keep the drafter's body whichever it is: its fallback carries the
            # raw digest and the specific reason, which beats our generic
            # notice. Only the success CLAIM is withheld.
            cp drafted.md note.md
          else
            # Loud, not silent. The reviewer sees this on the page they are
            # already looking at, with a link to the log that explains it.
            {
              printf '<!-- lex:notes-draft-failed -->\n\n'
              printf '> **Release notes could not be drafted automatically.**\n'
              printf '> The drafting step failed — see [the workflow run](%s).\n' "$RUN_URL"
              printf '> Write the notes by hand before promoting, or re-run the job.\n'
            } > note.md
          fi

          # Only a real draft claims the idempotence marker. A failure notice
          # that stamped it would make its own failure permanent: the next run
          # would see the marker, assume a human had written the notes, and
          # decline to try again.
          {
            printf '%s\n' "$BODY"
            printf '\n---\n\n'
            cat note.md
            if [ "$DRAFT_OK" = "yes" ]; then
              printf '\n<!-- lex:notes-drafted tag=%s -->\n' "$TAG"
            fi
          } > combined.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file combined.md

          if [ "$DRAFT_OK" = "yes" ]; then
            echo "Drafted release notes onto $TAG — review and edit before promoting."
          elif [ "$DRAFT_OUTCOME" = "success" ]; then
            echo "::warning title=Release note needs a human rewrite::The drafter ran but its output was rejected, so $TAG carries the raw digest. No marker was stamped, so re-running this job will try again."
          else
            echo "::warning::Drafting failed for $TAG; posted a failure notice on the release instead."
          fi
