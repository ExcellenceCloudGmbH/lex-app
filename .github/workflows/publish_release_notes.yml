# ──────────────────────────────────────────────────────────────────────
#  On promotion to a full release: commit the mechanical CHANGELOG.md
#  entry, and (later) publish the approved body to quackback.
#
#  The digest is rebuilt here rather than carried over from the gate run.
#  Workflow artifacts are scoped to the run that produced them, and the
#  gate runs on `prereleased` while this runs on `released` — two runs,
#  two events. Since the tag is fixed once the prerelease exists, the
#  digest is deterministic, so re-deriving it is cheaper than cross-run
#  artifact plumbing and needs no extra token.
#
#  CHANGELOG.md is mechanical and is never hand-edited. Only the business
#  note in the release body is reviewed, so a human rewriting the prose
#  cannot desync the technical record.
# ──────────────────────────────────────────────────────────────────────
name: Publish Release Notes

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)generate the changelog entry for"
        required: true
        type: string

jobs:
  changelog:
    name: "Commit the CHANGELOG entry"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Same reason as the gate: without PAC on disk the frontend range cannot
      # be read, and render-changelog would mark this release as having
      # unrecorded frontend changes.
      #
      # Deliberately NOT continue-on-error: `_pac_log` runs git with
      # cwd=./pac and no guard, so a broken checkout raises inside
      # render-changelog anyway. Failing here gives a clear message instead of
      # a traceback one step later. Uses FRONTEND_REPO_TOKEN, as the gate does.
      - name: Checkout the frontend repository
        uses: actions/checkout@v4
        with:
          repository: ExcellenceCloudGmbH/process-admin-general-client
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: pac
          fetch-depth: 0

      - name: Render and prepend the entry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          DATE=$(git log -1 --format=%cs "refs/tags/$TAG")
          PYTHONPATH=.github/scripts python -m release_notes render-changelog \
            --tag "$TAG" --date "$DATE" --pac-checkout ./pac

      # The Commit step below runs `git add`/`git pull --rebase` in this
      # workspace. `pac/` is an untracked directory inside it; removing it
      # first keeps the commit and any rebase operating on lex-app alone.
      - name: Remove the frontend checkout before committing
        run: rm -rf pac

      # Two destinations, two formats, one source: the body a human approved
      # on the release itself. quackback gets a help-centre article for
      # customers; Linear Pulse gets a project update for colleagues, which is
      # what makes it appear in their feed.
      #
      # continue-on-error is belt and braces — the script already exits 0 on
      # every failure path and reports each destination separately. By the time
      # this runs the note is public on GitHub, so a missing feed entry is a
      # nuisance while a red release is an incident.
      - name: Publish the note to quackback and Linear Pulse
        if: ${{ always() && github.event_name == 'release' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUACKBACK_API_KEY: ${{ secrets.QUACKBACK_API_KEY }}
          QUACKBACK_BASE_URL: ${{ vars.QUACKBACK_BASE_URL }}
          QUACKBACK_CATEGORY_ID: ${{ vars.QUACKBACK_CATEGORY_ID }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_PROJECT_ID: ${{ vars.LINEAR_PROJECT_ID }}
        run: |
          python .github/scripts/publish_release_note_externally.py \
            --tag "${{ github.event.release.tag_name }}" \
            --repo "$GITHUB_REPOSITORY"

      - name: Commit
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "No changelog change for $TAG — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs(changelog): ${TAG}"
          # The release has already shipped by this point, so a push race is
          # safe to retry once and then fail loudly.
          git push || { git pull --rebase && git push; }
