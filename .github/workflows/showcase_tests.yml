name: Showcase Tests (Business View)
# ──────────────────────────────────────────────────────────────────────
#  Customer-facing CI workflow.
#
#  Runs the full `lex/test_project/` suite grouped by CLUSTER (not by
#  individual test) and produces:
#    1. A `manifest.json` with per-cluster counts + coverage %.
#    2. A branded HTML + PDF "Platform Health Report" (customer view).
#    3. An email with the PDF attached, via SendGrid — ALWAYS sent,
#       pass or fail.
#    4. A final gating step that fails the job if any cluster failed.
#
#  Parallelised (Plan A): a `plan` job expands the cluster selector into
#  a matrix, a `showcase` job runs ONE runner per cluster (each with its
#  own Postgres + Redis), and an `aggregate` job merges the per-cluster
#  partial manifests + coverage, builds the ONE report, sends the ONE
#  email, and is the gate. The report/email/coverage-artifact behaviour
#  is identical to the previous single-job design — only the execution
#  fans out.
#
#  Callable as a reusable workflow (`workflow_call`) from
#  `pip_publish.yml` so a PyPI release is gated on this workflow AND
#  emits the email unconditionally.
#
#  Required secrets (Settings → Secrets → Actions):
#    SENDGRID_API_KEY
#    SHOWCASE_REPORT_RECIPIENTS   comma-separated recipient emails
#    SHOWCASE_REPORT_FROM         SendGrid-verified sender address
#
#  Optional Keycloak integration secrets. When present, the full init
#  cluster can run its live-Keycloak read-only tests without a local
#  .env file. Destructive Keycloak tests remain opt-in via the
#  LEX_RUN_KEYCLOAK_DESTRUCTIVE repo variable.
#    KEYCLOAK_URL
#    KEYCLOAK_REALM
#    KEYCLOAK_REALM_NAME          optional alias if your env uses this name
#    OIDC_RP_CLIENT_ID
#    OIDC_RP_CLIENT_SECRET
#    OIDC_RP_CLIENT_UUID
#
#  Optional:
#    SHOWCASE_REPORT_FROM_NAME    sender display name
#    SHOWCASE_BRAND (repo var)    brand shown on the report
#
#  Read docs/ci-cd/showcase-ci.md for the stakeholder guide.
# ──────────────────────────────────────────────────────────────────────
on:
  # The showcase is NOT triggered directly by release events — it only
  # runs as a reusable workflow called from pip_publish.yml (which is
  # the release-triggered workflow), or by manual dispatch. Triggering
  # on `release: published` directly would fire a second, parallel run
  # with an empty `inputs.clusters` (release events can't supply inputs),
  # which the guard rejects. Keep a single entry point via pip_publish.
  workflow_dispatch:
    inputs:
      clusters:
        description: >-
          Comma-separated cluster selector for
          ``run_showcase_suite.py --only``. Each entry is either
          ``<cluster_key>`` (whole cluster) or
          ``<cluster_key>:<test_suffix>`` (single test inside cluster).
          Default runs all registered clusters (init, CRUD, API layer,
          calculations, validation hooks, celery, history, audit logging,
          permissions, signals/WS, serializers, exports, queries).
        required: false
        default: >-
          init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries
      run_kind:
        description: >-
          Where this run came from — shown in the email subject so
          recipients can tell a manual operator-triggered run apart
          from an automated release-pipeline run. Use ``manual`` for
          ad-hoc dispatches and ``release`` when invoked as part of
          ``pip_publish.yml``.
        required: false
        type: choice
        default: manual
        options:
          - manual
          - release
          - scheduled
  workflow_call:
    inputs:
      clusters:
        description: >-
          Same syntax as workflow_dispatch.inputs.clusters. Callers
          (e.g. pip_publish.yml) pass their curated subset.
        required: false
        type: string
        default: >-
          init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries
      run_kind:
        description: >-
          Where this run came from. Callers (notably pip_publish.yml)
          should pass ``release`` so the email subject reflects that
          this is a release-gating run, not an operator-driven one.
        required: false
        type: string
        default: manual
    outputs:
      overall_ok:
        description: "true if every cluster passed, else false"
        value: ${{ jobs.aggregate.outputs.overall_ok }}
      clusters_passing:
        description: "e.g. '2/2'"
        value: ${{ jobs.aggregate.outputs.clusters_passing }}
jobs:
  # ── Job 1: plan — expand the selector into a per-cluster matrix ─────
  #  Runs in seconds. Refuses an empty selector (same guard as before —
  #  the showcase must be a deliberately curated list, never an implicit
  #  "run everything"). Emits both:
  #    * matrix     — the {key, test_suffix} objects for the fan-out;
  #    * expected   — the CSV of cluster keys the aggregate job requires
  #                   to be present, so a lost partial fails the gate.
  plan:
    name: Plan cluster matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      expected: ${{ steps.plan.outputs.expected }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.0
      - name: Compute matrix
        id: plan
        env:
          SHOWCASE_CLUSTERS: ${{ inputs.clusters }}
        run: |
          if [[ -z "$SHOWCASE_CLUSTERS" ]]; then
            echo "::error::No cluster subset provided (inputs.clusters is empty). Refusing to run the full suite implicitly."
            exit 1
          fi
          echo "Planning selector: $SHOWCASE_CLUSTERS"
          MATRIX=$(python .github/scripts/plan_showcase_matrix.py "$SHOWCASE_CLUSTERS")
          echo "matrix=$MATRIX"
          EXPECTED=$(python -c "import json,sys; print(','.join(e['key'] for e in json.loads(sys.argv[1])))" "$MATRIX")
          if [[ -z "$EXPECTED" ]]; then
            echo "::error::Selector expanded to zero clusters (all keys unknown?): $SHOWCASE_CLUSTERS"
            exit 1
          fi
          echo "matrix=$MATRIX"   >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"

  # ── Job 2: showcase — one runner per cluster ───────────────────────
  #  fail-fast:false so a single red cluster does NOT cancel its peers
  #  (the emailed report must list every cluster). continue-on-error:true
  #  so a failing cluster never fails THIS job — the aggregate job is the
  #  sole gate. Each matrix entry gets its own Postgres + Redis services
  #  (services are static per-job, so both are provisioned on every entry;
  #  only celery_async needs Redis, ~5s cost elsewhere — see plan risks).
  showcase:
    name: Run cluster ${{ matrix.cluster.key }}
    needs: plan
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cluster: ${{ fromJson(needs.plan.outputs.matrix) }}
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: lundadminlocal
          POSTGRES_DB: db_lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
      # Redis service is provisioned so the Cluster 8k Celery broker
      # tests (test_8k_redis_broker_integration.py — scenarios 8.45-8.48)
      # run a real producer → broker → in-process Celery worker → result
      # backend round-trip on every release. Without this service the
      # 8k tests skip silently (LEX_RUN_REDIS_CELERY_TESTS unset), which
      # is the "tests passed but proved nothing" failure mode the broker
      # gate exists to prevent. DB 15 is used so it never collides with
      # any other Redis usage on the runner.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python 3.12.0
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.0
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev pkg-config \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Install lex-app + report toolchain
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.txt
          pip install -e .
          pip install "coverage>=7.4"
      # Preserved from the retired django_tests.yml — persists the pip
      # cache so a re-run of this workflow (or a sibling workflow in
      # the same release) doesn't re-download everything.
      - name: Save pip cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
      # ── Run this ONE cluster, producing a partial manifest ──────────
      - name: Run cluster showcase suite
        id: run_suite
        continue-on-error: true
        env:
          DJANGO_SETTINGS_MODULE: lex_app.settings
          DATABASE_DEPLOYMENT_TARGET: default
          CELERY_ACTIVE: "False"
          # Opt the Cluster 8k Redis broker integration tests in. When
          # this flag is set, the 8k scenarios fail loudly if the Redis
          # service isn't reachable (instead of skipping silently) — so
          # a misconfigured release pipeline can't ship a green PyPI
          # build that never actually exercised the broker.
          LEX_RUN_REDIS_CELERY_TESTS: "true"
          LEX_CELERY_REDIS_TEST_URL: redis://127.0.0.1:6379/15
          # Enable the env-first path in the init Keycloak integration
          # tests. If any secret is missing, those tests skip cleanly;
          # no local .env file is required in CI.
          LEX_RUN_KEYCLOAK_INTEGRATION: "1"
          LEX_RUN_KEYCLOAK_DESTRUCTIVE: ${{ vars.LEX_RUN_KEYCLOAK_DESTRUCTIVE || '0' }}
          KEYCLOAK_URL: ${{ secrets.KEYCLOAK_URL }}
          KEYCLOAK_REALM: ${{ secrets.KEYCLOAK_REALM }}
          KEYCLOAK_REALM_NAME: ${{ secrets.KEYCLOAK_REALM_NAME }}
          OIDC_RP_CLIENT_ID: ${{ secrets.OIDC_RP_CLIENT_ID }}
          OIDC_RP_CLIENT_SECRET: ${{ secrets.OIDC_RP_CLIENT_SECRET }}
          OIDC_RP_CLIENT_UUID: ${{ secrets.OIDC_RP_CLIENT_UUID }}
          # One cluster per matrix entry. The suffix (single-test
          # selector) is carried through verbatim so the selector grammar
          # is identical to the sequential design.
          CLUSTER_KEY: ${{ matrix.cluster.key }}
          CLUSTER_SUFFIX: ${{ matrix.cluster.test_suffix }}
        run: |
          if [[ -n "$CLUSTER_SUFFIX" ]]; then
            SELECTOR="${CLUSTER_KEY}:${CLUSTER_SUFFIX}"
          else
            SELECTOR="${CLUSTER_KEY}"
          fi
          echo "Running selector: $SELECTOR"
          python .github/scripts/run_showcase_suite.py \
            --only "$SELECTOR" \
            --out manifest.partial.json \
            --coverage-data ".coverage.${CLUSTER_KEY}"
      # Rename the coverage data file so download-artifact keeps a stable,
      # collision-free name per cluster (artifact name is per-key anyway).
      - name: Upload partial manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-partial-${{ matrix.cluster.key }}
          path: manifest.partial.json
          if-no-files-found: warn
      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data-${{ matrix.cluster.key }}
          path: .coverage.${{ matrix.cluster.key }}
          if-no-files-found: warn
          include-hidden-files: true

  # ── Job 3: aggregate — merge, report, email, gate ──────────────────
  #  needs the whole matrix; runs even if clusters failed (`if: always()`)
  #  so the email ALWAYS fires. Merges the partials in CLUSTERS order,
  #  combines coverage, builds the ONE report, sends the ONE email, then
  #  gates: this job (and therefore the reusable workflow) succeeds iff
  #  every cluster passed. A lost partial is a hard error (--expected).
  aggregate:
    name: Aggregate, report & send
    needs: [plan, showcase]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_ok: ${{ steps.manifest.outputs.overall_ok }}
      clusters_passing: ${{ steps.manifest.outputs.clusters_passing }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12.0
      # weasyprint/cairosvg need cairo + pango at the C level to render
      # the PDF — same system deps the previous single job installed.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev pkg-config \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Install aggregator + report toolchain
        run: |
          pip install --upgrade pip
          pip install "coverage>=7.4" "weasyprint>=61" \
                      "cairosvg>=2.7" "sendgrid>=6.11"
      - name: Download partial manifests
        uses: actions/download-artifact@v4
        with:
          pattern: manifest-partial-*
          path: ./partials
      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-data-*
          path: ./coverage-data
      # ── Merge partials + combine coverage into one manifest.json ────
      - name: Aggregate partial manifests
        env:
          EXPECTED_CLUSTERS: ${{ needs.plan.outputs.expected }}
        run: |
          python .github/scripts/aggregate_showcase_manifests.py \
            --partials ./partials \
            --coverage-glob './coverage-data/**/.coverage.*' \
            --expected "$EXPECTED_CLUSTERS" \
            --out manifest.json
      # ── Coverage artifact — same name as before, downstream unchanged ─
      #  coverage.xml is produced by the aggregator's `coverage combine`
      #  step (written to the repo root).
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          if-no-files-found: warn
      # ── Read manifest → set job outputs (for pip_publish gate) ───
      - name: Parse manifest
        id: manifest
        if: always()
        run: |
          if [[ -f manifest.json ]]; then
            OVERALL=$(python -c "import json; m=json.load(open('manifest.json')); print(m['overall']['outcome'])")
            PASSING=$(python -c "import json; m=json.load(open('manifest.json')); print(f\"{m['overall']['clusters_passing']}/{m['overall']['clusters_total']}\")")
          else
            OVERALL="failure"
            PASSING="0/0"
          fi
          if [[ "$OVERALL" == "success" ]]; then
            echo "overall_ok=true"  >> "$GITHUB_OUTPUT"
          else
            echo "overall_ok=false" >> "$GITHUB_OUTPUT"
          fi
          echo "clusters_passing=$PASSING" >> "$GITHUB_OUTPUT"
      # ── Build the customer-facing report (HTML + PDF) ────────────
      - name: Build customer report
        if: always()
        env:
          SHOWCASE_BRAND: ${{ vars.SHOWCASE_BRAND || 'Excellence Cloud' }}
        run: |
          python .github/scripts/build_showcase_report.py \
            --manifest manifest.json \
            --out-html report.html \
            --out-pdf report.pdf \
            --out-logo logo.png
      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-health-report
          path: |
            report.html
            report.pdf
            logo.png
            manifest.json
      # ── ALWAYS send the email — pass or fail ─────────────────────
      - name: Send customer email
        if: always()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SHOWCASE_REPORT_RECIPIENTS: ${{ secrets.SHOWCASE_REPORT_RECIPIENTS }}
          SHOWCASE_REPORT_FROM: ${{ secrets.SHOWCASE_REPORT_FROM }}
          SHOWCASE_REPORT_FROM_NAME: ${{ secrets.SHOWCASE_REPORT_FROM_NAME }}
          SHOWCASE_BRAND: ${{ vars.SHOWCASE_BRAND || 'Excellence Cloud' }}
        run: |
          python .github/scripts/send_showcase_email.py \
            --html-path report.html \
            --pdf-path report.pdf \
            --logo-path logo.png \
            --logo-cid logo \
            --overall-ok "${{ steps.manifest.outputs.overall_ok }}" \
            --clusters-passing "${{ steps.manifest.outputs.clusters_passing }}" \
            --run-kind "${{ inputs.run_kind || 'manual' }}"
      # ── Final gate — fail the job if any cluster failed ──────────
      # (This runs AFTER the email step so the email always fires.)
      - name: Fail job if any cluster failed
        if: steps.manifest.outputs.overall_ok != 'true'
        run: |
          echo "::error::One or more clusters failed. See the emailed report."
          exit 1
