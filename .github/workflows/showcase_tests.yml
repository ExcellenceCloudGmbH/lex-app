name: Showcase Tests (Business View)
# ──────────────────────────────────────────────────────────────────────
#  Customer-facing CI workflow.
#
#  Runs TWO hand-picked tests from the `lex/test_project/` suite and
#  produces:
#    1. A quiet GitHub Step Summary (engineer view)
#    2. A branded HTML + PDF "Platform Health Report" (customer view)
#    3. An email with the PDF attached, via SendGrid
#
#  Required secrets (Settings → Secrets → Actions):
#    SENDGRID_API_KEY              — SendGrid API key
#    SHOWCASE_REPORT_RECIPIENTS    — comma-separated recipient emails
#    SHOWCASE_REPORT_FROM          — a SendGrid-verified sender address
#
#  Optional:
#    SHOWCASE_REPORT_FROM_NAME     — display name for the sender
#    SHOWCASE_BRAND (repo variable)— brand shown on the report
#
#  Read docs/ci-cd/showcase-ci.md for the stakeholder guide.
# ──────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
  push:
    branches: ["lex-app-v2"]
jobs:
  showcase:
    name: Run showcase tests & send report
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12.0]
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: django
          POSTGRES_PASSWORD: lundadminlocal
          POSTGRES_DB: db_lex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install system dependencies
        # libcairo2-dev, pkg-config — pycairo
        # libpango-1.0-0, libpangoft2-1.0-0 — WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev pkg-config \
            libpango-1.0-0 libpangoft2-1.0-0
      - name: Install lex-app + report toolchain
        run: |
          pip install --upgrade pip setuptools wheel
          pip install --prefer-binary -r requirements.txt
          pip install -e .
          pip install "weasyprint>=61" "cairosvg>=2.7" "sendgrid>=6.11"
      - name: Run test — Project initialisation
        id: test_init
        continue-on-error: true
        env:
          DJANGO_SETTINGS_MODULE: lex_app.settings
          DATABASE_DEPLOYMENT_TARGET: default
          CELERY_ACTIVE: "False"
        run: |
          start=$(date +%s.%N)
          lex test --verbosity=2 --noinput \
            lex.test_project.tests.init.test_1b_lex_init.TestCluster01b_LexInit.test_1_6b_init_runs_full_pipeline
          rc=$?
          end=$(date +%s.%N)
          duration=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e-s }')
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Run test — Create record via REST API
        id: test_crud
        continue-on-error: true
        env:
          DJANGO_SETTINGS_MODULE: lex_app.settings
          DATABASE_DEPLOYMENT_TARGET: default
          CELERY_ACTIVE: "False"
        run: |
          start=$(date +%s.%N)
          lex test --verbosity=2 --noinput \
            lex.test_project.tests.crud_api.test_2a_create.TestCluster02a_Create.test_2_1_post_creates_record
          rc=$?
          end=$(date +%s.%N)
          duration=$(awk -v s="$start" -v e="$end" 'BEGIN { printf "%.3f", e-s }')
          echo "duration=$duration" >> "$GITHUB_OUTPUT"
          exit $rc
      - name: Render engineer summary
        if: always()
        run: |
          python .github/scripts/showcase_summary.py \
            "${{ steps.test_init.outcome }}" \
            "${{ steps.test_crud.outcome }}"
      - name: Build customer report
        if: always()
        id: build_report
        env:
          SHOWCASE_BRAND: ${{ vars.SHOWCASE_BRAND || 'LEX Platform' }}
        run: |
          python .github/scripts/build_showcase_report.py \
            --init-outcome "${{ steps.test_init.outcome }}" \
            --init-duration "${{ steps.test_init.outputs.duration || 0 }}" \
            --crud-outcome "${{ steps.test_crud.outcome }}" \
            --crud-duration "${{ steps.test_crud.outputs.duration || 0 }}" \
            --out-html report.html \
            --out-pdf report.pdf
          if [[ "${{ steps.test_init.outcome }}" == "success" && \
                "${{ steps.test_crud.outcome }}" == "success" ]]; then
            echo "overall_ok=true"  >> "$GITHUB_OUTPUT"
          else
            echo "overall_ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload report artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-health-report
          path: |
            report.html
            report.pdf
      - name: Send customer email
        if: always()
        env:
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SHOWCASE_REPORT_RECIPIENTS: ${{ secrets.SHOWCASE_REPORT_RECIPIENTS }}
          SHOWCASE_REPORT_FROM: ${{ secrets.SHOWCASE_REPORT_FROM }}
          SHOWCASE_REPORT_FROM_NAME: ${{ secrets.SHOWCASE_REPORT_FROM_NAME }}
          SHOWCASE_BRAND: ${{ vars.SHOWCASE_BRAND || 'LEX Platform' }}
        run: |
          python .github/scripts/send_showcase_email.py \
            --html-path report.html \
            --pdf-path report.pdf \
            --overall-ok "${{ steps.build_report.outputs.overall_ok }}"
      - name: Fail job if any showcase test failed
        if: steps.test_init.outcome != 'success' || steps.test_crud.outcome != 'success'
        run: |
          echo "::error::One or more showcase tests failed. See the emailed report."
          exit 1
