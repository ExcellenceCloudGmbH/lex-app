# ──────────────────────────────────────────────────────────────────────
#  Publish lex-app to PyPI.
#
#  This workflow gates a PyPI release on TWO checks:
#    1. django_tests.yml    — runs `lex.test_project.tests` (the
#                             behaviour-driven suite from
#                             lex/test_project/) with coverage
#                             threshold (engineer-facing release gate).
#    2. showcase_tests.yml  — the 14-cluster customer-facing showcase.
#                             This workflow ALSO sends a branded
#                             "Platform Health Report" email via
#                             SendGrid on EVERY run — pass or fail —
#                             so stakeholders always get a status
#                             update on release day.
#
#  If either gate fails, the `publish` job is skipped and no version
#  is pushed to PyPI. If both pass, the sdist + wheel are built and
#  uploaded.
#
#  Version is derived from the GitHub release tag (e.g. v2.0.0rc124
#  → 2.0.0rc124). The version in pyproject.toml is dynamic — it reads
#  from lex/_version.py which this workflow writes before building.
#
#  Required secrets:
#   - PYPI_API_TOKEN               (PyPI API token with upload permission)
#   - SENDGRID_API_KEY             (used by the showcase workflow)
#   - SHOWCASE_REPORT_RECIPIENTS
#   - SHOWCASE_REPORT_FROM
# ──────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build but do not upload to PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      version:
        description: "Version to publish (e.g. 2.0.0rc124). Required for manual runs."
        required: false
        type: string

jobs:
  # ── Step 1a: Run the full internal test suite ─────────────────────
  gate-tests:
    name: "Gate: Test Suite"
    uses: ./.github/workflows/django_tests.yml
    secrets: inherit

  # ── Step 1b: Run the customer-facing Cluster Showcase ────────────
  # This job ALWAYS sends the Platform Health Report email via
  # SendGrid (see showcase_tests.yml) — pass or fail. If any cluster
  # fails, the job exits non-zero and the `publish` step below does
  # not run.
  #
  # The selector below is explicit — we do NOT run every cluster from
  # pip_publish. Current scope: a single representative test per
  # cluster for ``init`` (full first-run pipeline) and ``crud_api``
  # (create-via-POST). Expand the list as new clusters reach the
  # customer-facing bar.
  gate-showcase:
    name: "Gate: Cluster Showcase + Customer Email"
    uses: ./.github/workflows/showcase_tests.yml
    secrets: inherit
    with:
      clusters: "init:test_1b_lex_init.TestCluster01b_LexInit.test_1_6b_init_runs_full_pipeline,crud_api:test_2a_create.TestCluster02a_Create.test_2_1_post_creates_record"

  # ── Step 2: Build and publish (only if BOTH gates pass) ──────────
  publish:
    name: "Build & Publish"
    needs: [gate-tests, gate-showcase]   # ← hard dependency — skipped
                                         #   if either gate fails
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Determine version from release tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading 'v' from tag: v2.0.0rc124 → 2.0.0rc124
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Write version to lex/_version.py
        run: |
          echo '__version__ = "${{ steps.version.outputs.VERSION }}"' > lex/_version.py
          cat lex/_version.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
