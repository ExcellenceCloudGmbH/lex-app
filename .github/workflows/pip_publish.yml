# ──────────────────────────────────────────────────────────────────────
#  Publish lex-app to PyPI.
#
#  A PyPI release is gated on a single check:
#    showcase_tests.yml — runs the selected tests from
#                         ``lex/test_project/tests/`` with coverage,
#                         emits coverage.xml as a CI artifact, builds
#                         the "Platform Health Report" (HTML + PDF),
#                         and ALWAYS sends the branded email via
#                         SendGrid on EVERY run — pass or fail — so
#                         stakeholders always get a status update on
#                         release day.
#
#  History: ``django_tests.yml`` used to run as a second, parallel
#  gate. On 22 April 2026 it was absorbed into ``showcase_tests.yml``
#  — both workflows were running the same test selector and building
#  the same coverage.xml, so running them separately doubled the CI
#  cost with no added signal.
#
#  If the gate fails, the ``publish`` job is skipped and no version
#  is pushed to PyPI. If it passes, the sdist + wheel are built and
#  uploaded.
#
#  Version is derived from the GitHub release tag (e.g. v2.0.0rc124
#  → 2.0.0rc124). The version in pyproject.toml is dynamic — it reads
#  from lex/_version.py which this workflow writes before building.
#
#  Trigger: `release: created`. Fires when a non-draft release is
#  created directly. GitHub does NOT fire any `release` event for
#  draft creations — a draft sits silent until a maintainer flips
#  it to published, which then fires `published`/`released`. We
#  deliberately listen only on `created` so a release ships to PyPI
#  exactly once, at the moment it becomes a real (non-draft) release.
#  Upstream callers (e.g. copilot_publish_after_merge.yml) therefore
#  must NOT use `--draft` when creating releases programmatically.
#
#  Required secrets:
#   - PYPI_API_TOKEN               (PyPI API token with upload permission)
#   - SENDGRID_API_KEY             (used by the showcase workflow)
#   - SHOWCASE_REPORT_RECIPIENTS
#   - SHOWCASE_REPORT_FROM
#
#  Optional Keycloak integration secrets inherited by showcase_tests.yml:
#   - KEYCLOAK_URL
#   - KEYCLOAK_REALM or KEYCLOAK_REALM_NAME
#   - OIDC_RP_CLIENT_ID
#   - OIDC_RP_CLIENT_SECRET
#   - OIDC_RP_CLIENT_UUID
# ──────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  release:
    # `created` fires when a non-draft release is created (either
    # directly, or by flipping a draft to published — both count as
    # the moment the release becomes real). Drafts emit no release
    # event at all, so this is a single-shot trigger per release.
    # See header for the upstream contract this enforces.
    types: [created]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build but do not upload to PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      version:
        description: "Version to publish (e.g. 2.0.0rc124). Required for manual runs."
        required: false
        type: string
      clusters:
        description: >-
          Cluster selector fed to the release gate.
          Same syntax as ``run_showcase_suite.py --only``. Default runs
          all 13 registered clusters. Change this to trial-run a narrower
          subset from a manual dispatch.
        required: false
        type: string
        default: >-
          init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries

jobs:
  # ── Step 1: Gate on the selected tests + emit the customer report ─
  # showcase_tests.yml is the ONLY release gate (the former
  # django_tests.yml was absorbed into it on 22 April 2026 — it ran
  # the same tests twice with the same selector, so we consolidated).
  #
  # This job:
  #   * runs the tests (coverage run) for the configured selector,
  #   * emits coverage.xml as a CI artifact ("backend-coverage-report"),
  #   * builds the Platform Health Report HTML + PDF,
  #   * ALWAYS emails the report via SendGrid — pass or fail,
  #   * exits non-zero iff any cluster failed.
  #
  # The `publish` step below will not run unless this gate is green.
  gate-release:
    name: "Release Gate: Tests + Customer Email"
    uses: ./.github/workflows/showcase_tests.yml
    secrets: inherit
    with:
      # Single source of truth for the test scope. Edit here (or
      # override from workflow_dispatch) — the same selector drives
      # both the release gate and the email content.
      clusters: ${{ inputs.clusters || github.event.inputs.clusters || 'init,crud_api,api_layer,calculations,validation_hooks,celery_async,history,audit_logging,permissions,signals_ws,serializers,exports,queries' }}
      # Mark this as a release-pipeline run so the email subject can
      # distinguish it from operator-triggered manual dispatches.
      run_kind: release

  # ── Step 2: Build and publish (only if the gate passes) ──────────
  publish:
    name: "Build & Publish"
    needs: [gate-release]   # ← hard dependency — skipped if gate fails
                            #   (no PyPI push when tests fail)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Determine version from release tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # For release events (including drafts triggered via `created`),
            # GITHUB_REF_NAME points at the default branch, not the tag — the
            # tag is not a real git ref until the release is published. Read
            # the requested tag from the release payload instead.
            # Strip leading 'v': v2.0.0rc124 → 2.0.0rc124.
            TAG="${{ github.event.release.tag_name }}"
            VERSION="${TAG#v}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "::error::Could not determine version (no inputs.version and release.tag_name was empty)."
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Write version to lex/_version.py
        run: |
          echo '__version__ = "${{ steps.version.outputs.VERSION }}"' > lex/_version.py
          cat lex/_version.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
