# ──────────────────────────────────────────────────────────────────────
#  Publish lex-app to PyPI.
#
#  This workflow:
#   1. Calls the test suite (django_tests.yml) as a reusable workflow.
#   2. Only if ALL tests pass and coverage threshold is met, builds the
#      sdist + wheel and publishes to PyPI.
#   3. Can be triggered manually (workflow_dispatch) or on a GitHub
#      release (tag push).
#
#  Version is derived from the GitHub release tag (e.g. v2.0.0rc124
#  → 2.0.0rc124). The version in pyproject.toml is dynamic — it reads
#  from lex/_version.py which this workflow writes before building.
#
#  Required secrets:
#   - PYPI_API_TOKEN  (PyPI API token with upload permission)
# ──────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build but do not upload to PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      version:
        description: "Version to publish (e.g. 2.0.0rc124). Required for manual runs."
        required: false
        type: string

jobs:
  # ── Step 1: Run the full test suite ──────────────────────────────
  gate-tests:
    name: "Gate: Test Suite"
    uses: ./.github/workflows/django_tests.yml
    secrets: inherit

  # ── Step 2: Build and publish (only if tests pass) ──────────────
  publish:
    name: "Build & Publish"
    needs: gate-tests       # ← hard dependency — skipped if tests fail
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Determine version from release tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading 'v' from tag: v2.0.0rc124 → 2.0.0rc124
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Write version to lex/_version.py
        run: |
          echo '__version__ = "${{ steps.version.outputs.VERSION }}"' > lex/_version.py
          cat lex/_version.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
