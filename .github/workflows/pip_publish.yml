# ──────────────────────────────────────────────────────────────────────
#  Publish lex-app to PyPI.
#
#  A PyPI release is gated on a single check:
#    showcase_tests.yml — runs the selected tests from
#                         ``lex/test_project/tests/`` with coverage,
#                         emits coverage.xml as a CI artifact, builds
#                         the "Platform Health Report" (HTML + PDF),
#                         and ALWAYS sends the branded email via
#                         SendGrid on EVERY run — pass or fail — so
#                         stakeholders always get a status update on
#                         release day.
#
#  History: ``django_tests.yml`` used to run as a second, parallel
#  gate. On 22 April 2026 it was absorbed into ``showcase_tests.yml``
#  — both workflows were running the same test selector and building
#  the same coverage.xml, so running them separately doubled the CI
#  cost with no added signal.
#
#  If the gate fails, the ``publish`` job is skipped and no version
#  is pushed to PyPI. If it passes, the sdist + wheel are built and
#  uploaded.
#
#  Version is derived from the GitHub release tag (e.g. v2.0.0rc124
#  → 2.0.0rc124). The version in pyproject.toml is dynamic — it reads
#  from lex/_version.py which this workflow writes before building.
#
#  Required secrets:
#   - PYPI_API_TOKEN               (PyPI API token with upload permission)
#   - SENDGRID_API_KEY             (used by the showcase workflow)
#   - SHOWCASE_REPORT_RECIPIENTS
#   - SHOWCASE_REPORT_FROM
# ──────────────────────────────────────────────────────────────────────

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build but do not upload to PyPI"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      version:
        description: "Version to publish (e.g. 2.0.0rc124). Required for manual runs."
        required: false
        type: string
      clusters:
        description: >-
          Cluster selector fed to BOTH gate-tests and gate-showcase.
          Same syntax as ``run_showcase_suite.py --only``. Default is
          the release-blessed subset. Change this to trial-run a wider
          (or narrower) subset from a manual dispatch.
        required: false
        type: string
        default: >-
          init:test_1b_lex_init.TestCluster01b_LexInit.test_1_6b_init_runs_full_pipeline,crud_api:test_2a_create.TestCluster02a_Create.test_2_1_post_creates_record

jobs:
  # ── Step 1: Gate on the selected tests + emit the customer report ─
  # showcase_tests.yml is the ONLY release gate (the former
  # django_tests.yml was absorbed into it on 22 April 2026 — it ran
  # the same tests twice with the same selector, so we consolidated).
  #
  # This job:
  #   * runs the tests (coverage run) for the configured selector,
  #   * emits coverage.xml as a CI artifact ("backend-coverage-report"),
  #   * builds the Platform Health Report HTML + PDF,
  #   * ALWAYS emails the report via SendGrid — pass or fail,
  #   * exits non-zero iff any cluster failed.
  #
  # The `publish` step below will not run unless this gate is green.
  gate-release:
    name: "Release Gate: Tests + Customer Email"
    uses: ./.github/workflows/showcase_tests.yml
    secrets: inherit
    with:
      # Single source of truth for the test scope. Edit here (or
      # override from workflow_dispatch) — the same selector drives
      # both the release gate and the email content.
      clusters: ${{ inputs.clusters || 'init:test_1b_lex_init.TestCluster01b_LexInit.test_1_6b_init_runs_full_pipeline,crud_api:test_2a_create.TestCluster02a_Create.test_2_1_post_creates_record' }}

  # ── Step 2: Build and publish (only if the gate passes) ──────────
  publish:
    name: "Build & Publish"
    needs: [gate-release]   # ← hard dependency — skipped if gate fails
                            #   (no PyPI push when tests fail)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install --upgrade pip build twine

      - name: Determine version from release tag
        id: version
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip leading 'v' from tag: v2.0.0rc124 → 2.0.0rc124
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${VERSION}"

      - name: Write version to lex/_version.py
        run: |
          echo '__version__ = "${{ steps.version.outputs.VERSION }}"' > lex/_version.py
          cat lex/_version.py

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist with twine
        run: twine check dist/*

      - name: Publish to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
