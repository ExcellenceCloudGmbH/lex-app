# Roll the frontend back to a known-good version.
#
# The case for shipping a large interface change at all rests on being able to
# undo it cheaply. That was a claim rather than a mechanism: backing out meant
# hand editing requirements.txt under pressure, which is exactly when a hand
# edit goes wrong. v2.1.4 backed the redesign out with a whole-tree revert that
# took an unrelated fix with it.
#
# This opens a pull request repinning the frontend. It deliberately does NOT
# release: a human merges it and cuts a patch release, so the change is
# reviewed and the rollback appears in the history like anything else. The
# point is to remove the fiddly part, not the judgement.
name: Roll back the frontend

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Frontend version to pin, e.g. 1.11.2. Must exist on PyPI."
        required: true
        type: string
      reason:
        description: "Why. Goes in the PR body, and belongs in the release note."
        required: true
        type: string

jobs:
  rollback:
    name: "Pin the frontend to ${{ inputs.version }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Refuse a version that cannot be installed. Pinning something that does
      # not exist turns a rollback into a broken release — the worst outcome
      # for a change made in a hurry.
      - name: Check the version exists on PyPI
        run: |
          set -euo pipefail
          python -m pip download --no-deps --dest /tmp/rollback-check \
            "lex-app-frontend==${{ inputs.version }}"
          echo "lex-app-frontend ${{ inputs.version }} is installable."

      - name: Repin requirements.txt
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^\s*lex-app-frontend\s*[~=]=' requirements.txt \
            | head -1 | tr -d '[:space:]' || true)
          if [ -z "${CURRENT}" ]; then
            echo "::error::No lex-app-frontend pin found in requirements.txt — nothing to roll back."
            exit 1
          fi
          # ~= rather than ==, matching the convention: it keeps a project's
          # ability to take a patch version without a lex-app release.
          NEW="lex-app-frontend~=${{ inputs.version }}"
          if [ "${CURRENT}" = "${NEW}" ]; then
            echo "::error::requirements.txt already pins ${{ inputs.version }} — nothing to roll back."
            exit 1
          fi
          python - "$NEW" <<'PY'
          import pathlib, re, sys
          new = sys.argv[1]
          p = pathlib.Path("requirements.txt")
          text, count = re.subn(
              r"^\s*lex-app-frontend\s*[~=]=.*$", new, p.read_text(), count=1, flags=re.M
          )
          if count != 1:
              sys.exit("could not rewrite the lex-app-frontend pin")
          p.write_text(text)
          PY
          echo "${CURRENT}  ->  ${NEW}"
          grep -n "lex-app-frontend" requirements.txt

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "rollback/frontend-${{ inputs.version }}"
          base: lex-app-v2
          commit-message: |
            fix(frontend): roll back to ${{ inputs.version }}

            ${{ inputs.reason }}
          title: "fix(frontend): roll back to ${{ inputs.version }}"
          add-paths: requirements.txt
          body: |
            Repins the frontend to `~=${{ inputs.version }}`.

            **Reason:** ${{ inputs.reason }}

            ## What happens next

            1. Review and merge this.
            2. Cut a patch release as normal. `pip install lex-app` then
               resolves `lex-app-frontend~=${{ inputs.version }}`.

            ## What this does not do

            It does not release, and it does not write the release note. Both
            are deliberate.

            **The release note must say the frontend was rolled back and why.**
            `v2.1.3` shipped the redesign and `v2.1.4` pulled it back out with
            no note at either end — customers were told about a feature and
            then silently lost it. The reason above is the text to use.
