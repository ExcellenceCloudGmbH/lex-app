# ──────────────────────────────────────────────────────────────────────
#  Guard: reject local edits to MIRRORED (read-only) docs.
#
#  Model A makes the published doc subset (declared in docs/.docs-sync.yml)
#  a read-only mirror of lex-app-docs. Editing those files here is futile —
#  the next mirror sync overwrites them. This check fails such PRs early
#  with a message pointing the author upstream.
#
#  The sync bot's own PRs (head branch docs-sync/*) are exempt.
#
#  The second job is the opposite check and is NOT exempt: it verifies that
#  everything the published docs name -- imports, commands, environment
#  variables -- actually exists in this repo's source, and that nothing this
#  repo ships is missing from them. A sync PR is exactly when a bad reference
#  arrives from upstream, and a change under lex/ is exactly when a good one
#  stops resolving, so it runs for both.
#
#  See: docs/superpowers/specs/2026-05-31-docs-mirror-sync-design.md
# ──────────────────────────────────────────────────────────────────────

name: Docs Mirror Guard

on:
  pull_request:
    paths:
      - "docs/**"
      # A rename or deletion under lex/ can invalidate a published example
      # without touching a single .md file.
      - "lex/**"
      - ".github/scripts/check_doc_imports.py"

permissions:
  contents: read

jobs:
  guard:
    name: Reject edits to mirror-owned docs
    runs-on: ubuntu-latest
    # The mirror sync legitimately writes these paths.
    if: ${{ !startsWith(github.head_ref, 'docs-sync/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Collect changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" > /tmp/changed.txt
          echo "Changed files:"
          cat /tmp/changed.txt

      - name: Check no mirror-owned docs were edited
        run: |
          python .github/scripts/docs_mirror.py check-readonly < /tmp/changed.txt

  imports:
    name: Published docs only import things that exist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No install step on purpose. The checker resolves imports by parsing
      # the source tree, so it needs neither the package's dependencies nor
      # Django settings — which is what lets it run in a bare checkout.
      - name: Documented imports resolve
        run: python .github/scripts/check_doc_imports.py

      # Both directions. Every `lex <command>` the docs name must exist, and
      # every command this repo ships must be documented -- `lex --help` prints
      # ten of them, so the reference page is the only complete list a reader
      # has, and a new management command nobody documents is invisible.
      - name: Documented commands exist, and shipped commands are documented
        if: always()
        run: python .github/scripts/check_doc_commands.py

      - name: Every environment variable the framework reads is documented
        if: always()
        run: python .github/scripts/check_doc_env_vars.py
