<style>
  :root{--ds-panel:#20262e;--ds-ink:#e6ebf2;--ds-line:#39434f;--ds-term-bg:#20262e;--ds-term-ink:#dfe5ee;--ds-accent:#3fb8c9;--ds-accent-soft:rgba(63,184,201,.16);}
  @keyframes ds-pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
  @keyframes ds-fade{from{opacity:0}to{opacity:1}}
  @keyframes ds-ring{0%,100%{opacity:.6}50%{opacity:1}}
  .ds-badge{opacity:0;animation:ds-pop .32s cubic-bezier(.2,.9,.3,1.2) forwards;transform-box:fill-box;transform-origin:center}
  .ds-halo{opacity:0;animation:ds-fade .3s ease-out forwards,ds-ring 2.6s ease-in-out infinite}
  .ds-legend,.ds-leader{opacity:0;animation:ds-fade .3s ease-out forwards}
  .ds-s0 .ds-badge,.ds-s0 .ds-leader{animation-delay:0.00s}  .ds-s0.ds-legend{animation-delay:0.00s}  .ds-s0 .ds-halo{animation-delay:0.00s,0.00s}
  .ds-s1 .ds-badge,.ds-s1 .ds-leader{animation-delay:0.45s}  .ds-s1.ds-legend{animation-delay:0.45s}  .ds-s1 .ds-halo{animation-delay:0.45s,0.45s}
  .ds-s2 .ds-badge,.ds-s2 .ds-leader{animation-delay:0.90s}  .ds-s2.ds-legend{animation-delay:0.90s}  .ds-s2 .ds-halo{animation-delay:0.90s,0.90s}
  @media (prefers-reduced-motion: reduce){.ds-badge,.ds-halo,.ds-legend,.ds-leader{opacity:1;animation:none}.ds-halo{opacity:.85}}
</style>
