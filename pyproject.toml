[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-app"
description = "A Python / Django library to create business applications easily with complex logic"
readme = {file = "README.md", content-type = "text/markdown"}
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Melih Sünbül", email = "m.sunbul@excellence-cloud.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dynamic = ["version", "dependencies"]

[project.urls]
Homepage = "https://github.com/ExcellenceCloudGmbH/lex-app"

[project.scripts]
lex = "lex.__main__:main"
lex-generate-configs = "generate_pycharm_configs:generate_pycharm_configs"
lex-recovery-supervisor = "lex.lex_app.celery_recovery.entrypoint:main"
lex-recovery-beat = "lex.lex_app.celery_recovery.entrypoint:beat_main"

[tool.setuptools]
py-modules = ["generate_pycharm_configs"]

[tool.setuptools.dynamic]
version = {attr = "lex._version.__version__"}
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["lex*", "migrations_logic*"]

[tool.setuptools.package-data]
"lex.react" = ["**/*"]
"lex.assets" = ["**/*"]
"lex.lex_app.streamlit._lex_view_component" = ["frontend/**/*"]

[tool.pytest.ini_options]
# The lex CLI bootstraps Django and calls setup_test_environment() before
# handing off to pytest.main(). Disable the pytest-django plugin so it
# does not call setup_test_environment() a second time (which raises
# RuntimeError since Django 4.2+).
addopts = "-p no:django"

