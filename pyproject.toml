[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lex-app"
version = "2.0.0rc79"
description = "A Python / Django library to create business applications easily with complex logic"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE.txt"}
requires-python = "==3.12"
authors = [
    {name = "Melih Sünbül", email = "m.sunbul@excellence-cloud.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/ExcellenceCloudGmbH/lex-app"

[project.scripts]
lex = "lex.__main__:main"
lex-generate-configs = "generate_pycharm_configs:generate_pycharm_configs"

[tool.setuptools]
py-modules = ["generate_pycharm_configs"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["lex*", "migrations_logic*"]

[tool.setuptools.package-data]
"lex.react" = ["**/*"]
"lex.assets" = ["**/*"]

